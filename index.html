<script>
// ===== SERVICE WORKER (PWA offline support) =====
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE='entregou-v2';
    self.addEventListener('install',e=>{self.skipWaiting();});
    self.addEventListener('activate',e=>{self.clients.claim();});
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
    });
  `;
  const blob = new Blob([sw], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ===== INSTALL PROMPT =====
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install banner after 3s if not installed
  setTimeout(() => {
    if (deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
      const banner = document.createElement('div');
      banner.id = 'install-banner';
      banner.innerHTML = `
        <div style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:998;max-width:340px;width:calc(100% - 40px)">
          <span style="font-size:24px">📦</span>
          <div style="flex:1">
            <div>Instalar o Entregou</div>
            <div style="font-size:11px;font-weight:400;opacity:.7;margin-top:2px">Adicione à tela inicial para acesso rápido</div>
          </div>
          <button id="install-yes" style="background:#185FA5;color:white;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Instalar</button>
          <button id="install-no" style="background:transparent;color:white;border:none;font-size:18px;cursor:pointer;padding:0;opacity:.6">✕</button>
        </div>
      `;
      document.body.appendChild(banner);
      document.getElementById('install-yes').onclick = async () => {
        deferredPrompt.prompt();
        const {outcome} = await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.remove();
      };
      document.getElementById('install-no').onclick = () => banner.remove();
    }
  }, 3000);
});
</script>
