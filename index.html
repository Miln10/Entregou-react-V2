                <tfoot><tr style={{background:'var(--bg2)'}}>
                  <td style={{padding:'8px',fontSize:12,fontWeight:600,color:'var(--text2)'}}>TOTAIS</td>
                  <td style={{padding:'8px',textAlign:'center',fontSize:12,fontWeight:700,color:'var(--blue)'}}>R${clientBairros.reduce((a,b)=>a+(+(b.client_price||b.cliente||0)),0).toFixed(2)}</td>
                  <td style={{padding:'8px',textAlign:'center',fontSize:12,fontWeight:700,color:'var(--green)'}}>R${clientBairros.reduce((a,b)=>a+(+(b.courier_price||b.entregador||0)),0).toFixed(2)}</td>
                  <td style={{padding:'8px',textAlign:'center',fontSize:12,fontWeight:700,color:'var(--amber)'}}>R${clientBairros.reduce((a,b)=>{const pool=+(getSetting('multinivel',{total_pool:1}).total_pool)||1;const g=+(b.client_price||b.cliente||0)-(+(b.courier_price||b.entregador||0))-pool;return a+(g>0?g:0);},0).toFixed(2)}</td>
                  <td></td>
                </tr></tfoot>
              </table>
            </div>
          }
          {clientBairros.length>0&&<div style={{display:'flex',gap:8,margin:'12px 0',flexWrap:'wrap'}}>
            <div className="mcard" style={{flex:1,minWidth:80}}><div className="mval" style={{fontSize:15,color:'var(--blue)'}}>R${clientBairros.length?(clientBairros.reduce((a,b)=>a+(+(b.client_price||b.cliente||0)),0)/clientBairros.length).toFixed(2):'0'}</div><div className="mlbl">ticket médio cliente</div></div>
            <div className="mcard" style={{flex:1,minWidth:80}}><div className="mval" style={{fontSize:15,color:'var(--green)'}}>R${clientBairros.length?(clientBairros.reduce((a,b)=>a+(+(b.courier_price||b.entregador||0)),0)/clientBairros.length).toFixed(2):'0'}</div><div className="mlbl">ticket médio entregador</div></div>
            <div className="mcard" style={{flex:1,minWidth:80}}><div className="mval" style={{fontSize:15,color:'var(--amber)'}}>R${(()=>{const pool=+(getSetting('multinivel',{total_pool:1}).total_pool)||1;const t=clientBairros.reduce((a,b)=>{const g=+(b.client_price||b.cliente||0)-(+(b.courier_price||b.entregador||0))-pool;return a+(g>0?g:0);},0);return clientBairros.length?(t/clientBairros.length).toFixed(2):'0';})()}</div><div className="mlbl">margem média gestora</div></div>
          </div>}
          <button className="btn btn-blue" style={{marginTop:8}} onClick={saveClientPrices} disabled={saving}>{saving?'Salvando...':'💾 Salvar tabela de preços'}</button>
          <div style={{fontSize:11,color:'var(--text2)',marginTop:8,lineHeight:1.5}}>⚠️ O cliente vê apenas o valor da entrega. O entregador vê apenas o que recebe. Só o admin vê os 3 valores.</div>
        </>}
      </div>}
      {tab==='redes'&&<div style={{padding:'14px'}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>Criar nova rede</div>
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <input value={newNetName} onChange={e=>setNewNetName(e.target.value)} placeholder="Nome da rede (ex: Rede Icaraí)" onKeyDown={e=>e.key==='Enter'&&createNetwork()}/>
          <button className="btn-sm accept" onClick={createNetwork} style={{whiteSpace:'nowrap'}}>+ Criar</button>
        </div>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>Vincular clientes às redes</div>
        {clients.length===0?<div className="notice ni">Nenhum cliente cadastrado ainda.</div>:
          clients.map(c=><div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
            <div style={{flex:1,fontSize:13,fontWeight:500}}>{c.name}</div>
            <select value={c.network_id||''} onChange={e=>assignNetwork(c.id,e.target.value)} style={{fontSize:12,padding:'5px 8px',maxWidth:160}}>
              <option value="">Sem rede</option>
              {networks.map(n=><option key={n.id} value={n.id}>{n.name}</option>)}
            </select>
          </div>)
        }
        {networks.length>0&&<>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',margin:'16px 0 10px'}}>Redes cadastradas</div>
          {networks.map(n=>{const members=clients.filter(c=>c.network_id===n.id);return<div key={n.id} className="ocard" style={{margin:'0 0 8px'}}><div style={{fontSize:13,fontWeight:600}}>{n.name}</div><div style={{fontSize:11,color:'var(--text2)',marginTop:4}}>{members.length} cliente{members.length!==1?'s':''}: {members.map(c=>c.name).join(', ')||'nenhum'}</div></div>;})}
        </>}
      </div>}

      {tab==='multinivel'&&<div style={{padding:'14px'}}>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:16,lineHeight:1.6}}>Configure os valores distribuídos por entrega. O total do pool é sempre descontado do valor pago pelo cliente. O que sobrar vai para a gestora.</div>
        <div style={{background:'var(--bg2)',borderRadius:'var(--r)',padding:14,marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>Pool por entrega</div>
          <div style={{marginBottom:10}}><label className="flabel">Total do pool (R$) — valor fixo descontado de cada entrega</label><input type="number" value={ml.total_pool} onChange={e=>setMl({...ml,total_pool:e.target.value})} step="0.10"/></div>
          <div style={{height:1,background:'var(--border)',margin:'12px 0'}}/>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>Distribuição</div>
          <div style={{marginBottom:10}}><label className="flabel">Nível 1 recebe (entregador Nível 2 faz entrega)</label><input type="number" value={ml.nivel2_para_nivel1} onChange={e=>setMl({...ml,nivel2_para_nivel1:e.target.value})} step="0.10"/></div>
          <div style={{marginBottom:10}}><label className="flabel">Nível 0 recebe (entregador Nível 2 faz entrega)</label><input type="number" value={ml.nivel2_para_nivel0} onChange={e=>setMl({...ml,nivel2_para_nivel0:e.target.value})} step="0.10"/></div>
          <div style={{marginBottom:10}}><label className="flabel">Nível 0 recebe (entregador Nível 1 faz entrega)</label><input type="number" value={ml.nivel1} onChange={e=>setMl({...ml,nivel1:e.target.value})} step="0.10"/></div>
        </div>
        <div className="pbox">
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Simulação por cenário</div>
          <div className="prow"><span>Entregador Nível 2 faz entrega</span><span style={{fontSize:12}}>L1 recebe R${(+ml.nivel2_para_nivel1).toFixed(2)} · L0 recebe R${(+ml.nivel2_para_nivel0).toFixed(2)} · Gestora R${Math.max(0,+ml.total_pool-+ml.nivel2_para_nivel1-+ml.nivel2_para_nivel0).toFixed(2)}</span></div>
          <div className="prow"><span>Entregador Nível 1 faz entrega</span><span style={{fontSize:12}}>L0 recebe R${(+ml.nivel1).toFixed(2)} · Gestora R${Math.max(0,+ml.total_pool-+ml.nivel1).toFixed(2)}</span></div>
          <div className="prow"><span>Entregador Nível 0 faz entrega</span><span style={{fontSize:12}}>Gestora fica com R${(+ml.total_pool).toFixed(2)}</span></div>
        </div>
        <button className="btn btn-blue" style={{marginTop:12}} onClick={saveMultinivel} disabled={saving}>{saving?'Salvando...':'Salvar configurações'}</button>
      </div>}
    </div>
  </div>;
}


// ===== ADMIN SHIFTS =====
function AdminShifts({setPage}) {
  const toast = useToast();
  const [clients, setClients] = useState([]);
  const [selClient, setSelClient] = useState('');
  const [shifts, setShifts] = useState([]);
  const [loading, setLoading] = useState(false);
  const [view, setView] = useState('list'); // list | create
  // Create form
  const [form, setForm] = useState({date:'', start:'17:00', end:'23:00', slots:1, notes:''});
  const [creating, setCreating] = useState(false);
  // Assignments
  const [assignments, setAssignments] = useState({});
  const [couriers, setCouriers] = useState([]);
  const [expandShift, setExpandShift] = useState(null);

  useEffect(()=>{
    db.from('users').select('id,name').eq('role','client').order('name').then(({data})=>setClients(data||[]));
    db.from('users').select('id,name,courier_number').eq('role','courier').order('name').then(({data})=>setCouriers(data||[]));
  },[]);

  useEffect(()=>{ if(selClient) loadShifts(); },[selClient]);

  const loadShifts = async () => {
    if (!selClient) return;
    setLoading(true);
    const today = new Date().toISOString().slice(0,10);
    const {data} = await db.from('shifts').select('*').eq('client_id',selClient).gte('date',today).order('date').order('start_time');
    const shiftList = data||[];
    setShifts(shiftList);
    // Load assignments for each shift
    if (shiftList.length) {
      const ids = shiftList.map(s=>s.id);
      const {data:ass} = await db.from('shift_assignments').select('*').in('shift_id',ids);
      const map = {};
      (ass||[]).forEach(a=>{ if(!map[a.shift_id]) map[a.shift_id]=[]; map[a.shift_id].push(a); });
      setAssignments(map);
    }
    setLoading(false);
  };

  const createShift = async () => {
    if (!selClient||!form.date||!form.start||!form.end) { toast('Preencha todos os campos'); return; }
    setCreating(true);
    const client = clients.find(x=>x.id===selClient);
    await db.from('shifts').insert({client_id:selClient,client_name:client?.name||'',date:form.date,start_time:form.start,end_time:form.end,slots:+form.slots,notes:form.notes});
    setCreating(false);
    toast('Turno criado ✓');
    setView('list');
    loadShifts();
  };

  const createWeekShifts = async (pattern) => {
    // pattern: [{days:[1,2,3,4], slots:5, start:'17:00', end:'23:00'}, ...]
    setCreating(true);
    const client = clients.find(x=>x.id===selClient);
    const today = new Date();
    const rows = [];
    for (let i=0; i<14; i++) {
      const d = new Date(today); d.setDate(today.getDate()+i);
      const dow = d.getDay(); // 0=sun,1=mon...
      for (const p of pattern) {
        if (p.days.includes(dow)) {
          rows.push({client_id:selClient,client_name:client?.name||'',date:d.toISOString().slice(0,10),start_time:p.start,end_time:p.end,slots:p.slots,notes:''});
        }
      }
    }
    if (rows.length) await db.from('shifts').insert(rows);
    setCreating(false);
    toast(rows.length+' turnos criados para as próximas 2 semanas ✓');
    setView('list');
    loadShifts();
  };

  const assignCourier = async (shiftId, courierId) => {
    if (!courierId) return;
    const courier = couriers.find(x=>x.id===courierId);
    const existing = (assignments[shiftId]||[]).find(a=>a.courier_id===courierId);
    if (existing) { toast('Entregador já alocado neste turno'); return; }
    const shift = shifts.find(s=>s.id===shiftId);
    const filled = (assignments[shiftId]||[]).filter(a=>a.status!=='cancelled').length;
    if (filled >= (shift?.slots||1)) { toast('Turno já está completo'); return; }
    await db.from('shift_assignments').insert({shift_id:shiftId,courier_id:courierId,courier_name:courier?.name||'',courier_number:courier?.courier_number||null,status:'confirmed',assigned_by:'admin'});
    toast(courier?.name+' alocado ✓');
    loadShifts();
  };

  const markStatus = async (ass, status) => {
    await db.from('shift_assignments').update({status}).eq('id',ass.id);
    // If marking absent or cancelling a confirmed slot, promote from waitlist
    if ((status==='absent'||status==='cancelled') && !ass.waitlist_position) {
      const {data:waiters} = await db.from('shift_assignments').select('*').eq('shift_id',ass.shift_id).eq('status','waitlist').order('waitlist_position').limit(1);
      if (waiters?.length) {
        const first = waiters[0];
        await db.from('shift_assignments').update({status:'confirmed',waitlist_position:null,notified_at:new Date().toISOString()}).eq('id',first.id);
        toast((status==='absent'?'Falta registrada':'Cancelado')+'. '+first.courier_name+' promovido da fila! ✓');
      } else {
        toast(status==='present'?'Presença confirmada ✓':status==='absent'?'Falta registrada':'Cancelado');
      }
    } else {
      toast(status==='present'?'Presença confirmada ✓':status==='absent'?'Falta registrada':'Cancelado');
    }
    loadShifts();
  };

  const removeShift = async (id) => {
    if (!confirm('Remover este turno?')) return;
    await db.from('shifts').delete().eq('id',id);
    toast('Turno removido');
    loadShifts();
  };

  const statusColor = {confirmed:'var(--blue)',present:'var(--green)',absent:'var(--red)',cancelled:'var(--text2)',waitlist:'var(--amber)'};
  const statusLabel = {confirmed:'Confirmado',present:'Presente',absent:'Faltou',cancelled:'Cancelado',waitlist:'Fila #'};
  const statusBg    = {confirmed:'var(--blue-l)',present:'var(--green-l)',absent:'var(--red-l)',cancelled:'var(--bg2)',waitlist:'var(--amber-l)'};

  const DAYS_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const fmtDay = d => { const dt=new Date(d+'T12:00:00'); return DAYS_SHORT[dt.getDay()]+' '+dt.getDate()+'/'+String(dt.getMonth()+1).padStart(2,'0'); };

  return <AdminShell page="admin-shifts" setPage={setPage}>
    <Topbar title="Escala de turnos" badge="Admin" badgeClass="ba">
      <button className="btn-sm" onClick={()=>setView(view==='list'?'create':'list')} style={{marginLeft:'auto'}}>{view==='list'?'+ Novo turno':'← Voltar'}</button>
    </Topbar>
    <div className="scroll">

      <div className="fgrp" style={{padding:'12px 14px 8px'}}>
        <select value={selClient} onChange={e=>setSelClient(e.target.value)}>
          <option value="">— Selecione o cliente —</option>
          {clients.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
        </select>
      </div>

      {/* CREATE VIEW */}
      {view==='create'&&selClient&&<div style={{padding:'0 14px'}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>Turno único</div>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <div style={{flex:1}}><label className="flabel">Data</label><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
          <div style={{flex:1}}><label className="flabel">Vagas</label><input type="number" min="1" value={form.slots} onChange={e=>setForm({...form,slots:+e.target.value})}/></div>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <div style={{flex:1}}><label className="flabel">Início</label><input type="time" value={form.start} onChange={e=>setForm({...form,start:e.target.value})}/></div>
          <div style={{flex:1}}><label className="flabel">Término</label><input type="time" value={form.end} onChange={e=>setForm({...form,end:e.target.value})}/></div>
        </div>
        <div style={{marginBottom:12}}><label className="flabel">Observação</label><input value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Opcional"/></div>
        <button className="btn btn-blue" style={{marginBottom:20}} onClick={createShift} disabled={creating}>{creating?'Criando...':'Criar turno'}</button>

        <div style={{height:1,background:'var(--border)',margin:'0 0 16px'}}/>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>Escala recorrente (2 semanas)</div>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:12}}>Cria turnos automaticamente para seg–qui e sex–dom, como no seu exemplo:</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn-sm accept" style={{padding:'10px 14px',fontSize:13}} onClick={()=>createWeekShifts([{days:[1,2,3,4],slots:5,start:'17:00',end:'23:00'},{days:[5,6,0],slots:15,start:'17:00',end:'23:00'}])} disabled={creating}>
            Padrão Seg–Qui 5 vagas / Sex–Dom 15 vagas (17h–23h)
          </button>
        </div>
        <div style={{fontSize:11,color:'var(--text2)',marginTop:8}}>Quer um padrão diferente? Crie turnos individuais acima.</div>
      </div>}

      {/* LIST VIEW */}
      {view==='list'&&selClient&&<>
        {loading?<Loading/>:shifts.length===0?<Empty icon="📅" text="Nenhum turno futuro. Crie o primeiro!"/>:
          shifts.map(s=>{
            const ass=assignments[s.id]||[];
            const active=ass.filter(a=>a.status!=='cancelled');
            const filled=active.length;
            const pct=Math.round(filled/s.slots*100);
            const isExpanded=expandShift===s.id;
            return <div key={s.id} className="ocard" style={{margin:'0 14px 8px'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:8}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700}}>{fmtDay(s.date)}</div>
                  <div style={{fontSize:12,color:'var(--text2)'}}>{s.start_time} – {s.end_time}{s.notes?' · '+s.notes:''}</div>
                </div>

                    {a.status!=='cancelled'&&<button className="btn-sm" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>markStatus(a,'cancelled')}>× canc.</button>}
                  </div>
                </div>)}
                <button className="btn-sm danger" style={{marginTop:10,fontSize:11}} onClick={()=>removeShift(s.id)}>🗑 Remover turno</button>
              </div>}
            </div>;
          })
        }
      </>}
    </div>
  </AdminShell>;
}

function CourierShifts({setPage}) {
  const {profile} = useAuth(); const toast = useToast();
  const [shifts, setShifts] = useState([]);
  const [myShifts, setMyShifts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('available');

  useEffect(()=>{ load(); },[profile]);

  const load = async () => {
    if (!profile) return;
    setLoading(true);
    const today = new Date().toISOString().slice(0,10);
    // All future shifts
    const {data:allShifts} = await db.from('shifts').select('*').gte('date',today).order('date').order('start_time');
    // My assignments
    const {data:myAss} = await db.from('shift_assignments').select('*,shifts(*)').eq('courier_id',profile.id).gte('shifts.date',today);
    // All assignments to check availability
    const ids=(allShifts||[]).map(s=>s.id);
    let assMap={};
    if(ids.length){
      const {data:allAss}=await db.from('shift_assignments').select('shift_id,status').in('shift_id',ids);
      (allAss||[]).forEach(a=>{if(!assMap[a.shift_id])assMap[a.shift_id]=[];assMap[a.shift_id].push(a);});
    }
    // Filter available (not full, not already signed up)
    const myShiftIds=new Set((myAss||[]).filter(a=>a.status!=='cancelled').map(a=>a.shift_id));
    const available=(allShifts||[]).filter(s=>{
      if(myShiftIds.has(s.id)) return false;
      const confirmed=(assMap[s.id]||[]).filter(a=>a.status!=='cancelled'&&!a.waitlist_position).length;
      s._filled=confirmed;
      return true; // show all, including waitlist slots
    });
    setShifts(available);
    setMyShifts((myAss||[]).filter(a=>a.shifts));
    setLoading(false);
  };

  const signup = async (shift) => {
    // Check current fill
    const {data:current} = await db.from('shift_assignments').select('id,status,waitlist_position').eq('shift_id',shift.id).neq('status','cancelled');
    const filled = (current||[]).filter(a=>!a.waitlist_position).length;
    const isWaitlist = filled >= shift.slots;
    // Get next waitlist position
    let waitPos = null;
    if (isWaitlist) {
      const waiters = (current||[]).filter(a=>a.waitlist_position).sort((a,b)=>a.waitlist_position-b.waitlist_position);
      waitPos = waiters.length > 0 ? waiters[waiters.length-1].waitlist_position + 1 : 1;
    }
    await db.from('shift_assignments').insert({
      shift_id:shift.id, courier_id:profile.id, courier_name:profile.name,
      courier_number:profile.courier_number||null,
      status: isWaitlist ? 'waitlist' : 'confirmed',
      assigned_by:'courier',
      waitlist_position: waitPos
    });
    if (isWaitlist) toast('Turno completo! Você entrou na fila de espera #'+waitPos+' 📋');
    else toast('Vaga confirmada! ✓');
    load();
  };

  const promoteFromWaitlist = async (shiftId) => {
    // Get first in waitlist
    const {data:waiters} = await db.from('shift_assignments').select('*').eq('shift_id',shiftId).eq('status','waitlist').order('waitlist_position').limit(1);
    if (!waiters?.length) return;
    const first = waiters[0];
    await db.from('shift_assignments').update({status:'confirmed', waitlist_position:null, notified_at:new Date().toISOString()}).eq('id',first.id);
    return first.courier_name;
  };

  const cancel = async (ass) => {
    if (!confirm('Cancelar sua presença neste turno?')) return;
    await db.from('shift_assignments').update({status:'cancelled'}).eq('id',ass.id);
    // If was confirmed (not waitlist), promote next in line
    if (!ass.waitlist_position) {
      const promoted = await promoteFromWaitlist(ass.shift_id);
      if (promoted) toast('Presença cancelada. '+promoted+' foi promovido da fila de espera!');
      else toast('Presença cancelada');
    } else {
      toast('Removido da fila de espera');
    }
    load();
  };

  const DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const fmtDay = d => { const dt=new Date(d+'T12:00:00'); return DAYS[dt.getDay()]+' '+dt.getDate()+'/'+String(dt.getMonth()+1).padStart(2,'0'); };
  const statusColor={confirmed:'var(--blue)',present:'var(--green)',absent:'var(--red)',cancelled:'var(--text2)',waitlist:'var(--amber)'};
  const statusLabel={confirmed:'Confirmado',present:'Presente',absent:'Faltou',cancelled:'Cancelado',waitlist:'Fila de espera'};

  const ts=t=>({padding:'9px 14px',fontSize:13,fontWeight:tab===t?600:400,cursor:'pointer',color:tab===t?'var(--blue)':'var(--text2)',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',fontFamily:'var(--font)'});

  return <div className="screen">
    <Topbar title="Turnos disponíveis" onBack={()=>setPage('courier')} badge="Entregador" badgeClass="bd"/>
    <div className="scroll">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)'}}>
        <button style={ts('available')} onClick={()=>setTab('available')}>Vagas abertas</button>
        <button style={ts('mine')} onClick={()=>setTab('mine')}>Meus turnos</button>
      </div>

      {loading?<Loading/>:<>
        {tab==='available'&&<>
          {shifts.length===0?<Empty icon="📅" text="Nenhuma vaga disponível no momento."/>:
            shifts.map(s=><div key={s.id} className="ocard" style={{margin:'8px 14px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700}}>{fmtDay(s.date)}</div>
                  <div style={{fontSize:12,color:'var(--text2)'}}>{s.start_time} – {s.end_time}</div>
                  <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>👤 {s.client_name}{s.notes?' · '+s.notes:''}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:12,fontWeight:600,color:s._filled>=s.slots?'var(--amber)':'var(--green)'}}>{s._filled>=s.slots?'Fila de espera':'Vagas abertas'}</div>
                  <div style={{fontSize:11,color:'var(--text2)',marginTop:2}}>{s._filled}/{s.slots} preenchidas</div>
                </div>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <button className="btn-sm accept" style={{flex:1,padding:'9px',fontSize:13}} onClick={()=>signup(s)}>Confirmar presença</button>
                {s._filled>=s.slots&&<span style={{fontSize:11,padding:'3px 9px',borderRadius:20,background:'var(--amber-l)',color:'var(--amber)',fontWeight:600,whiteSpace:'nowrap'}}>Fila de espera</span>}
              </div>
            </div>)
          }
        </>}

        {tab==='mine'&&<>
          {myShifts.length===0?<Empty icon="📋" text="Você ainda não tem turnos confirmados."/>:
            myShifts.sort((a,b)=>a.shifts.date.localeCompare(b.shifts.date)).map(a=><div key={a.id} className="ocard" style={{margin:'8px 14px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700}}>{fmtDay(a.shifts.date)}</div>
                  <div style={{fontSize:12,color:'var(--text2)'}}>{a.shifts.start_time} – {a.shifts.end_time}</div>
                  <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>👤 {a.shifts.client_name}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <span style={{fontSize:11,padding:'3px 9px',borderRadius:20,fontWeight:600,background:a.status==='present'?'var(--green-l)':a.status==='absent'?'var(--red-l)':a.status==='cancelled'?'var(--bg2)':a.status==='waitlist'?'var(--amber-l)':'var(--blue-l)',color:statusColor[a.status]}}>{a.status==='waitlist'?'Fila #'+a.waitlist_position:statusLabel[a.status]}</span>
                  {a.notified_at&&a.status==='confirmed'&&<div style={{fontSize:10,color:'var(--green)',marginTop:3}}>★ Promovido da fila!</div>}
                </div>
              </div>
              {(a.status==='confirmed'||a.status==='waitlist')&&<button className="btn-sm danger" style={{marginTop:10,width:'100%',padding:'7px',fontSize:12}} onClick={()=>cancel(a)}>{a.status==='waitlist'?'Sair da fila de espera':'Cancelar minha presença'}</button>}
            </div>)
          }
        </>}
      </>}
    </div>
  </div>;
}

function AdminCouriers({setPage}) {
  const toast = useToast();
  const [couriers, setCouriers] = useState([]);
  const [networks, setNetworks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('org'); // org | list
  const [search, setSearch] = useState('');
  const [editId, setEditId] = useState(null);
  const [editData, setEditData] = useState({});
  const [moveModal, setMoveModal] = useState(null);
  const [moveTarget, setMoveTarget] = useState('');
  const [moveWithTeam, setMoveWithTeam] = useState(false);
  const [expandId, setExpandId] = useState(null);

  const [clients, setClients] = useState([]);

  const load = useCallback(async () => {
    const [cr, nw, cl] = await Promise.all([
      db.from('users').select('id,name,email,phone,vehicle,plate,is_online,can_refer,referral_code,referred_by,network_id,courier_number,forced_level,created_at').eq('role','courier').order('name'),
      db.from('networks').select('*').order('name'),
      db.from('users').select('id,name,network_id').eq('role','client').order('name'),
    ]);
    setCouriers(cr.data || []);
    setNetworks(nw.data || []);
    setClients(cl.data || []);
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  // Level calculated purely from referral chain
  const getLevel = (courier) => {
    if (courier.forced_level !== null && courier.forced_level !== undefined) return courier.forced_level;
    if (!courier.referred_by) return 0;
    const referrer = couriers.find(c => c.id === courier.referred_by);
    if (!referrer || !referrer.referred_by) return 1;
    return 2;
  };

  // Find root (nivel 0) of a courier
  const getRoot = (courier) => {
    if (!courier.referred_by) return courier;
    const referrer = couriers.find(c => c.id === courier.referred_by);
    if (!referrer) return courier;
    return getRoot(referrer);
  };

  // Build networks from referral chains — group by root
  const buildNetworks = () => {
    const roots = couriers.filter(c => getLevel(c) === 0);
    return roots.map(root => {
      const nivel1 = couriers.filter(c => c.referred_by === root.id);
      const nivel2 = nivel1.flatMap(l1 => couriers.filter(c => c.referred_by === l1.id).map(l2 => ({...l2, parentId: l1.id})));
      return { root, nivel1, nivel2 };
    });
  };

  // Standalone couriers (no referral, no one referred them, but level 0)
  // Actually all nivel-0 are roots, including standalone

  const isLevelForced = (c) => c.forced_level !== null && c.forced_level !== undefined;

  const levelColor = { 0:'var(--amber)', 1:'var(--blue)', 2:'var(--green)' };
  const levelBg    = { 0:'var(--amber-l)', 1:'var(--blue-l)', 2:'var(--green-l)' };

  const toggleReferral = async (id, enable, name, code) => {
    const nc = enable ? (code || genCode(name)) : undefined;
    await db.from('users').update({ can_refer: enable, ...(enable && nc && { referral_code: nc }) }).eq('id', id);
    toast(enable ? `${name} pode indicar ✓` : 'Permissão revogada'); load();
  };

  const saveEdit = async () => {
    await db.from('users').update({ name:editData.name, phone:editData.phone, vehicle:editData.vehicle, plate:editData.plate }).eq('id', editId);
    toast('Dados atualizados ✓'); setEditId(null); load();
  };

  const assignNumber = async (id, name) => {
    const num = await genCourierNumber();
    await db.from('users').update({ courier_number: num }).eq('id', id);
    toast(`Número #${num} atribuído a ${name} ✓`); load();
  };

  const forceLevel = async (id, name, level) => {
    const val = level === '' ? null : +level;
    await db.from('users').update({ forced_level: val }).eq('id', id);
    toast(val !== null ? `Nível ${val} definido para ${name} ✓` : `Nível automático restaurado para ${name} ✓`); load();
  };

  const confirmMove = async () => {
    if (!moveModal) return;
    // Moving means changing referred_by to put under a different root
    if (moveWithTeam) {
      const team = couriers.filter(c => c.referred_by === moveModal.id);
      const ids = [moveModal.id, ...team.map(c => c.id)];
      await db.from('users').update({ network_id: moveTarget||null }).in('id', ids);
    } else {
      await db.from('users').update({ network_id: moveTarget||null }).eq('id', moveModal.id);
    }
    toast(`${moveModal.name} movido ✓`);
    setMoveModal(null); setMoveTarget(''); setMoveWithTeam(false); load();
  };

  const deleteUser = async (id, name) => {
    if (!confirm(`Remover ${name}?`)) return;
    await db.from('users').delete().eq('id', id);
    toast(`${name} removido`); load();
  };

  const getNetworkCount = (id) => couriers.filter(c => c.referred_by === id).length;

  const nets = buildNetworks();
  const totalOnline = couriers.filter(c => c.is_online).length;

  // Mini card for org chart
  const OrgCard = ({courier, level, slim=false}) => {
    const lv = getLevel(courier);
    const isEx = expandId === courier.id;
    return <div style={{background:'var(--bg)',border:`1.5px solid ${levelColor[lv]}`,borderRadius:'var(--r)',padding:slim?'8px 10px':'12px 14px',minWidth:slim?120:150,position:'relative'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:courier.is_online?'var(--green-l)':'var(--bg2)',border:`2px solid ${courier.is_online?'var(--green-m)':'var(--border)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>🛵</div>
        <div style={{minWidth:0}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:100}}>{courier.name?.split(' ')[0]}</div>
          {courier.courier_number&&<div style={{fontSize:10,color:'var(--blue)',fontWeight:700}}>#{courier.courier_number}</div>}
        </div>
      </div>
      <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
        <span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:levelBg[lv],color:levelColor[lv],fontWeight:700}}>N{lv}</span>
        {courier.is_online&&<span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:'var(--green-l)',color:'var(--green)',fontWeight:700}}>●</span>}
        {courier.can_refer&&<span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:'var(--blue-l)',color:'var(--blue)',fontWeight:700}}>✓ indica</span>}
        {isLevelForced(courier)&&<span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:'var(--amber-l)',color:'var(--amber)',fontWeight:700}}>⚠️</span>}
      </div>
      <button onClick={()=>setExpandId(isEx?null:courier.id)} style={{position:'absolute',top:6,right:6,background:'none',border:'none',cursor:'pointer',fontSize:12,color:'var(--text2)',padding:2}}>
        {isEx?'▲':'▼'}
      </button>
      {isEx&&<div style={{marginTop:10,borderTop:'1px solid var(--border)',paddingTop:8,fontSize:11,color:'var(--text2)'}}>
        <div style={{marginBottom:6}}>{courier.vehicle||'Moto'}{courier.plate?` · ${courier.plate}`:''}</div>
        {courier.phone&&<div style={{marginBottom:6}}>📱 {courier.phone}</div>}
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {courier.phone&&<a href={`https://wa.me/55${courier.phone.replace(/\D/g,'')}`} target="_blank" style={{fontSize:11,padding:'3px 8px',borderRadius:6,background:'#25D366',color:'white',textDecoration:'none',fontWeight:600}}>💬</a>}
          {!courier.courier_number&&<button className="btn-sm" style={{fontSize:10,padding:'3px 7px',background:'var(--blue-l)',borderColor:'var(--blue-m)',color:'var(--blue)'}} onClick={()=>assignNumber(courier.id,courier.name)}>🔢</button>}
          <button className="btn-sm" style={{fontSize:10,padding:'3px 7px'}} onClick={()=>{setEditId(courier.id);setEditData({name:courier.name,phone:courier.phone||'',vehicle:courier.vehicle||'Moto',plate:courier.plate||''});}}>✏️</button>
          {!courier.can_refer
            ?<button className="btn-sm accept" style={{fontSize:10,padding:'3px 7px'}} onClick={()=>toggleReferral(courier.id,true,courier.name,courier.referral_code)}>✓ indicar</button>
            :<button className="btn-sm danger" style={{fontSize:10,padding:'3px 7px'}} onClick={()=>toggleReferral(courier.id,false,courier.name,courier.referral_code)}>✗ indicar</button>}

        </div>
        {/* Force level */}
        <div style={{marginTop:8}}>
          <select value={isLevelForced(courier)?String(courier.forced_level):''} onChange={e=>forceLevel(courier.id,courier.name,e.target.value)} style={{fontSize:11,padding:'4px 6px',width:'100%'}}>

            <option value="2">Forçar Nível 2</option>
          </select>
        </div>
        {/* Edit form inline */}
        {editId===courier.id&&<div style={{marginTop:8,display:'flex',flexDirection:'column',gap:6}}>
          <input value={editData.name} onChange={e=>setEditData({...editData,name:e.target.value})} placeholder="Nome" style={{fontSize:12,padding:'5px 8px'}}/>
          <input value={editData.phone} onChange={e=>setEditData({...editData,phone:e.target.value})} placeholder="WhatsApp" style={{fontSize:12,padding:'5px 8px'}}/>
          <div style={{display:'flex',gap:6}}>
            <button className="btn-sm progress" style={{flex:1,fontSize:11}} onClick={saveEdit}>Salvar</button>
            <button className="btn-sm" style={{flex:1,fontSize:11}} onClick={()=>setEditId(null)}>Cancelar</button>
          </div>
        </div>}
      </div>}
    </div>;
  };

  // Connector line style
  const vLine = {width:2,background:'var(--border)',margin:'0 auto'};
  const hLine = {height:2,background:'var(--border)',flex:1};

  const filtered = couriers.filter(c => !search || c.name.toLowerCase().includes(search.toLowerCase()) || (c.courier_number||'').includes(search) || (c.phone||'').includes(search));
  const levelCounts = { total:couriers.length, online:totalOnline, n0:nets.length, n1:couriers.filter(c=>getLevel(c)===1).length, n2:couriers.filter(c=>getLevel(c)===2).length };

  return <AdminShell page="admin-couriers" setPage={setPage}>

      <div style={{display:'flex',gap:6,marginLeft:'auto'}}>

            <input type="radio" checked={!moveWithTeam} onChange={()=>setMoveWithTeam(false)}/> Mover só ele

                    <OrgCard courier={l1} level={1} slim/>

        {/* LIST VIEW */}
        {view==='list'&&<div>
          {filtered.length===0?<Empty icon="🛵" text="Nenhum entregador encontrado."/>:
            filtered.map(c=>{
              const level=getLevel(c);
              const isExpanded=expandId===c.id;
              const isEditing=editId===c.id;
              const networkCount=getNetworkCount(c.id);
              const referrerName=c.referred_by?couriers.find(x=>x.id===c.referred_by)?.name:null;
              const rootName=getRoot(c).name;
              return <div key={c.id} className="ocard" style={{margin:'0 14px 8px'}}>
                <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:8}}>
                  <div style={{width:38,height:38,borderRadius:'50%',background:c.is_online?'var(--green-l)':'var(--bg2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0,border:`2px solid ${c.is_online?'var(--green-m)':'var(--border)'}`}}>🛵</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                      {c.courier_number&&<span style={{fontSize:12,fontWeight:800,color:'var(--blue)',background:'var(--blue-l)',padding:'2px 7px',borderRadius:6}}>#{c.courier_number}</span>}
                      <span style={{fontSize:14,fontWeight:700}}>{c.name}</span>
                      <span style={{fontSize:11,padding:'2px 7px',borderRadius:20,fontWeight:700,background:levelBg[level],color:levelColor[level]}}>Nível {level}</span>
                      {c.is_online&&<span style={{fontSize:10,padding:'2px 6px',borderRadius:20,background:'var(--green-l)',color:'var(--green)',fontWeight:600}}>🟢</span>}
                      {isLevelForced(c)&&<span style={{fontSize:10,padding:'2px 6px',borderRadius:20,background:'var(--amber-l)',color:'var(--amber)',fontWeight:600}}>⚠️ Forçado</span>}
                    </div>
                    <div style={{fontSize:11,color:'var(--text2)',marginTop:2}}>{c.vehicle||'Moto'}{c.plate?` · ${c.plate}`:''}{c.phone?` · 📱 ${c.phone}`:''}</div>
                    {referrerName&&<div style={{fontSize:11,color:'var(--blue)',marginTop:1}}>👆 Indicado por: {referrerName}</div>}
                    {level>0&&<div style={{fontSize:11,color:'var(--amber)',marginTop:1}}>🌳 Rede de: {rootName}</div>}
                    {networkCount>0&&<div style={{fontSize:11,color:'var(--green)',marginTop:1}}>👥 Indicou {networkCount} entregador{networkCount!==1?'es':''}</div>}
                  </div>
                  <button onClick={()=>setExpandId(isExpanded?null:c.id)} style={{background:'none',border:'none',fontSize:16,cursor:'pointer',color:'var(--text2)',padding:'2px 4px',flexShrink:0}}>{isExpanded?'▲':'▼'}</button>
                </div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {c.phone&&<a href={`https://wa.me/55${c.phone.replace(/\D/g,'')}`} target="_blank" style={{display:'flex',alignItems:'center',gap:4,padding:'5px 10px',background:'#25D366',color:'white',borderRadius:6,textDecoration:'none',fontSize:12,fontWeight:600}}>💬 Zap</a>}
                  {!c.courier_number&&<button className="btn-sm" style={{background:'var(--blue-l)',borderColor:'var(--blue-m)',color:'var(--blue)'}} onClick={()=>assignNumber(c.id,c.name)}>🔢 Número</button>}

                    <div style={{marginBottom:8}}><label className="flabel">Nome</label><input value={editData.name} onChange={e=>setEditData({...editData,name:e.target.value})}/></div>

                    <div style={{display:'flex',gap:8,marginBottom:12}}><div style={{flex:1}}><label className="flabel">Veículo</label><select value={editData.vehicle} onChange={e=>setEditData({...editData,vehicle:e.target.value})}><option>Moto</option><option>Bicicleta</option><option>Carro</option></select></div><div style={{flex:1}}><label className="flabel">Placa</label><input value={editData.plate} onChange={e=>setEditData({...editData,plate:e.target.value})} placeholder="ABC-1234"/></div></div>
                    <div style={{display:'flex',gap:8}}><button className="btn-sm progress" style={{flex:1,padding:'8px'}} onClick={saveEdit}>Salvar</button><button className="btn-sm" style={{flex:1,padding:'8px'}} onClick={()=>setEditId(null)}>Cancelar</button></div>
                  </>:<>
                    <div style={{fontSize:12,color:'var(--text2)',lineHeight:2}}>
                      <div>📧 {c.email}</div>
                      <div>📅 Cadastrado em {fmtDate(c.created_at)}</div>
                      {c.referral_code&&<div>🔗 Código: <strong style={{color:'var(--blue)'}}>{c.referral_code}</strong></div>}
                      {c.can_refer&&<div style={{fontSize:11,color:'var(--blue)',wordBreak:'break-all'}}>🔗 Link: {window.location.origin+window.location.pathname}?role=courier&ref={c.referral_code}</div>}
                    </div>
                    <div style={{marginTop:10,padding:10,background:'var(--bg2)',borderRadius:'var(--rs)'}}>
                      <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Nível manual</div>
                      <select value={isLevelForced(c)?String(c.forced_level):''} onChange={e=>forceLevel(c.id,c.name,e.target.value)} style={{fontSize:13,padding:'6px 10px',width:'100%'}}>
                        <option value="">Automático (pela cadeia de indicações)</option>

                      {c.can_refer&&<button className="btn-sm danger" onClick={()=>toggleReferral(c.id,false,c.name,c.referral_code)}>Revogar permissão de indicar</button>}
                      <button className="btn-sm danger" onClick={()=>deleteUser(c.id,c.name)}>🗑 Remover</button>
                    </div>
                  </>}
                </div>}
              </div>;
            })
          }
        </div>}
      </>}
    </div>
  </AdminShell>;
}

function AdminManualDelivery({setPage}) {
  const toast = useToast();
  const [couriers, setCouriers] = useState([]);
  const [clients,  setClients]  = useState([]);
  const [selCourier, setSelCourier] = useState('');
  const [selClient,  setSelClient]  = useState('');
  const [priceItems, setPriceItems] = useState([]);
  const [quantities, setQuantities] = useState({});
  const [date, setDate] = useState(new Date().toISOString().slice(0,10));
  const [notes, setNotes] = useState('');
  const [loading, setLoading] = useState(false);
  const [preview, setPreview] = useState([]);

  useEffect(()=>{
    db.from('users').select('id,name,courier_number,referred_by').eq('role','courier').order('name').then(({data})=>setCouriers(data||[]));
    db.from('users').select('id,name,address').eq('role','client').order('name').then(({data})=>setClients(data||[]));
  },[]);

  const onSelectClient = async (id) => {
    setSelClient(id); setQuantities({}); setPriceItems([]); setPreview([]);
    if (!id) return;
    const items = await getPriceTableForClient(id);
    setPriceItems(items);
  };

  const onQtyChange = (key, val) => {
    const qty = Math.max(0, parseInt(val)||0);
    const newQty = {...quantities, [key]: qty};
    if (qty === 0) delete newQty[key];
    setQuantities(newQty);
    const ml = getSetting('multinivel',{total_pool:1.00});
    const pool = +(ml.total_pool)||1.00;
    const prev = [];
    Object.entries(newQty).forEach(([k, q]) => {
      if (q <= 0) return;
      const item = priceItems.find(p=>(p.neighborhood_key||p.key)===k);
      if (!item) return;
      const cp  = +(item.client_price||item.cliente||0);
      const crp = +(item.courier_price||item.entregador||0);
      const gestora = Math.max(0, +(cp - crp - pool).toFixed(2));
      prev.push({key:k, label:item.neighborhood_label||item.label, qty:q, cp, crp, gestora, pool});
    });
    setPreview(prev);
  };

  const totalQty     = preview.reduce((a,p)=>a+p.qty,0);
  const totalCourier = preview.reduce((a,p)=>a+(p.crp*p.qty),0);
  const totalClient  = preview.reduce((a,p)=>a+(p.cp*p.qty),0);
  const totalGestora = preview.reduce((a,p)=>a+(p.gestora*p.qty),0);
  const totalPool    = preview.reduce((a,p)=>a+(p.pool*p.qty),0);

  const submit = async () => {
    if (!selCourier) { toast('Selecione o entregador'); return; }
    if (!selClient)  { toast('Selecione o cliente'); return; }
    if (totalQty === 0) { toast('Informe ao menos 1 entrega'); return; }
    setLoading(true);
    const courier = couriers.find(x=>x.id===selCourier);
    const client  = clients.find(x=>x.id===selClient);
    const ml   = getSetting('multinivel',{total_pool:1.00,nivel1:0.70,nivel2_para_nivel1:0.70,nivel2_para_nivel0:0.30});
    const pool = +(ml.total_pool)||1.00;
    const L1   = +(ml.nivel1)||0.70;
    const L2L0 = +(ml.nivel2_para_nivel0)||0.30;
    const week = getWeekBounds(0);
    const ws   = week.start.toISOString().slice(0,10);
    const we   = week.end.toISOString().slice(0,10);
    let created = 0;
    for (const p of preview) {
      for (let i = 0; i < p.qty; i++) {
        const { data: order, error } = await db.from('orders').insert({
          client_id:selClient, client_name:client?.name||'',
          courier_id:selCourier, courier_name:courier?.name||'',
          courier_number:courier?.courier_number||null,
          pickup_addr:client?.address||'Manual',
          delivery_addr:p.label, neighborhood:p.key,
          item_desc:notes||'Entrega manual',
          price:p.cp, courier_price:p.crp, gestora_amount:p.gestora,
          status:'done',
          created_at:new Date(date).toISOString(),
          updated_at:new Date(date).toISOString(),
        }).select().single();
        if (error) { console.error(error); continue; }
        created++;
        if (courier?.referred_by) {
          const {data:l1} = await db.from('users').select('id,name,can_refer,referred_by').eq('id',courier.referred_by).single();
          if (l1?.can_refer) {
            let dist=0;
            await db.from('referral_bonuses').insert({earner_id:l1.id,earner_name:l1.name,source_courier_id:courier.id,source_courier_name:courier.name,order_id:order.id,level:1,amount:L1,week_start:ws,week_end:we});
            dist+=L1;
            if (l1.referred_by) {
              const {data:l0} = await db.from('users').select('id,name,can_refer').eq('id',l1.referred_by).single();
              if (l0?.can_refer) { await db.from('referral_bonuses').insert({earner_id:l0.id,earner_name:l0.name,source_courier_id:courier.id,source_courier_name:courier.name,order_id:order.id,level:0,amount:L2L0,week_start:ws,week_end:we}); dist+=L2L0; }
            }
            const remaining = Math.max(0,+(pool-dist).toFixed(2));
            if (remaining>0) await db.from('orders').update({gestora_amount:p.gestora+remaining}).eq('id',order.id);
          }
        }
      }
    }
    setLoading(false);
    toast(created + (created!==1?' entregas registradas':' entrega registrada') + ' para ' + (courier?.name||'') + ' ✓');
    setSelCourier(''); setSelClient(''); setQuantities({}); setPriceItems([]); setPreview([]); setNotes('');
    setPage('admin-orders');

function AdminMap({setPage}) {
  const [couriers, setCouriers] = useState([]);
  const [orders, setOrders] = useState([]);
  const mapRef = useRef(null), mapObj = useRef(null), markers = useRef({});

  const load = useCallback(async () => {
    const [cr, or] = await Promise.all([
      db.from('users').select('id,name,lat,lng,is_online,vehicle,plate,location_updated_at').eq('role','courier'),
      db.from('orders').select('id,courier_id,status,delivery_addr,neighborhood').in('status',['accepted','collecting','delivering'])
    ]);
    setCouriers(cr.data || []);
    setOrders(or.data || []);
  }, []);

  useEffect(() => { load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, [load]);

  useEffect(() => {
    const L = window.L; if (!L || !mapRef.current) return;
    if (!mapObj.current) {
      const map = L.map(mapRef.current, { zoomControl: true, attributionControl: false }).setView([-22.9035, -43.1337], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      mapObj.current = map;
    }
    const map = mapObj.current;
    const seen = new Set();
    couriers.forEach(c => {
      if (!c.lat || !c.lng) return;
      seen.add(c.id);
      const activeOrder = orders.find(o => o.courier_id === c.id);
      const color = c.is_online ? (activeOrder ? '#3B6D11' : '#185FA5') : '#888';
      const label = activeOrder ? `🛵 ${c.name}<br><small>Entregando: ${activeOrder.neighborhood||activeOrder.delivery_addr}</small>` : `🛵 ${c.name}<br><small>${c.is_online ? 'Online — aguardando' : 'Offline'}</small>`;
      const html = `<div style="background:${color};width:38px;height:38px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;">🛵</div>`;
      const icon = L.divIcon({ html, iconSize:[38,38], iconAnchor:[19,19], className:'' });
      if (markers.current[c.id]) {
        markers.current[c.id].setLatLng([c.lat, c.lng]).setIcon(icon).setPopupContent(`<strong>${label}</strong>`);
      } else {
        markers.current[c.id] = L.marker([c.lat, c.lng], { icon }).addTo(map).bindPopup(`<strong>${label}</strong>`);
      }
    });
    // remove markers of couriers no longer visible
    Object.keys(markers.current).forEach(id => {
      if (!seen.has(id)) { markers.current[id].remove(); delete markers.current[id]; }
    });
  }, [couriers, orders]);

  const online  = couriers.filter(c => c.is_online && c.lat);
  const offline = couriers.filter(c => !c.is_online || !c.lat);
  const active  = couriers.filter(c => orders.find(o => o.courier_id === c.id));

  return <AdminShell page="admin-map" setPage={setPage}>
    <Topbar title="Mapa ao vivo" badge="Admin" badgeClass="ba">
      <button className="btn-sm" onClick={load} style={{marginLeft:'auto',fontSize:11}}>↻ Atualizar</button>
    </Topbar>
    <div className="scroll" style={{paddingBottom:0}}>
      {/* Stats strip */}
      <div style={{display:'flex',gap:8,padding:'10px 14px 8px'}}>
        <div className="mcard" style={{flex:1}}><div className="mval" style={{color:'var(--green)',fontSize:18}}>{online.length}</div><div className="mlbl">online c/ GPS</div></div>
        <div className="mcard" style={{flex:1}}><div className="mval" style={{color:'var(--blue)',fontSize:18}}>{active.length}</div><div className="mlbl">em entrega</div></div>
        <div className="mcard" style={{flex:1}}><div className="mval" style={{color:'var(--text2)',fontSize:18}}>{offline.length}</div><div className="mlbl">offline</div></div>
      </div>

      {/* Legend */}
      <div style={{padding:'0 14px 8px',display:'flex',gap:14,fontSize:12,color:'var(--text2)'}}>
        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:'#3B6D11',marginRight:4}}></span>Em entrega</span>
        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:'#185FA5',marginRight:4}}></span>Online / livre</span>
        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:'#888',marginRight:4}}></span>Offline</span>
      </div>

      {/* Map */}
      <div ref={mapRef} style={{height:'calc(100vh - 280px)',width:'100%',minHeight:300}}/>

      {/* Courier list */}
      <div style={{padding:'10px 14px 0'}}>
        <div className="stitle" style={{padding:'8px 0 6px'}}>Entregadores</div>
        {couriers.length === 0
          ? <div className="notice ni">Nenhum entregador cadastrado.</div>
          : couriers.map(c => {
            const aOrder = orders.find(o => o.courier_id === c.id);
            const lastSeen = c.location_updated_at ? ago(c.location_updated_at) : 'sem GPS';
            return <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{width:36,height:36,borderRadius:'50%',background:c.is_online?'var(--green-l)':'var(--bg2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>🛵</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600}}>{c.name}</div>
                <div style={{fontSize:11,color:'var(--text2)'}}>{c.vehicle||'Moto'}{c.plate?` · ${c.plate}`:''} · GPS: {lastSeen}</div>
                {aOrder && <div style={{fontSize:11,color:'var(--green)',marginTop:2}}>📦 Entregando: {aOrder.neighborhood||aOrder.delivery_addr}</div>}
              </div>
              <span className={`sbadge ${c.is_online ? (aOrder?'sc':'sa') : 'scanc'}`}>{c.is_online ? (aOrder?'Em entrega':'Online') : 'Offline'}</span>
            </div>;
          })
        }
      </div>
    </div>
  </AdminShell>;
}

function AdminNewClient({setPage}) {
  const toast = useToast();
  const [name, setName]       = useState('');
  const [email, setEmail]     = useState('');
  const [pass, setPass]       = useState('');
  const [phone, setPhone]     = useState('');
  const [address, setAddress] = useState('');
  const [err, setErr]         = useState('');
  const [loading, setLoading] = useState(false);
  const [showPass, setShowPass] = useState(false);
  const [done, setDone]       = useState(null);

  const submit = async () => {
    setErr('');
    if (!name)  { setErr('Informe o nome da loja.'); return; }
    if (!email) { setErr('Informe o e-mail.'); return; }
    if (!pass || pass.length < 6) { setErr('Senha deve ter ao menos 6 caracteres.'); return; }
    // Check duplicate
    const { data: ex } = await db.from('users').select('id').eq('email', email).maybeSingle();
    if (ex) { setErr('E-mail já cadastrado.'); return; }
    setLoading(true);
    // Create auth user
    const { data: auth, error: ae } = await db.auth.admin
      ? db.auth.signUp({ email, password: pass })
      : db.auth.signUp({ email, password: pass });
    // Use signUp (works without admin key)
    const { data: authData, error: authErr } = await db.auth.signUp({ email, password: pass });
    if (authErr) { setErr(authErr.message.includes('already') ? 'E-mail já cadastrado.' : authErr.message); setLoading(false); return; }
    // Insert user profile
    const { error: dbErr } = await db.from('users').insert({
      auth_id: authData.user.id,
      name, email, role: 'client',
      phone: phone || null,
      address: address || null,
    });
    setLoading(false);
    if (dbErr) { setErr('Erro ao salvar perfil: ' + dbErr.message); return; }
    setDone({ name, email });
    toast('Cliente ' + name + ' cadastrado com sucesso! ✓');
  };

  const reset = () => { setName(''); setEmail(''); setPass(''); setPhone(''); setAddress(''); setErr(''); setDone(null); };

  return <AdminShell page="admin-new-client" setPage={setPage}>
    <Topbar title="Cadastrar cliente" onBack={()=>setPage('admin')} badge="Admin" badgeClass="ba"/>
    <div className="scroll">

      {done ? <div style={{padding:'30px 20px',textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:12}}>✅</div>
        <div style={{fontSize:16,fontWeight:600,marginBottom:6}}>{done.name} cadastrado!</div>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:20}}>{done.email}</div>
        <div className="notice ni" style={{textAlign:'left',marginBottom:16}}>
          <strong>Próximos passos:</strong><br/>
          1. Configure a tabela de preços em <strong>⚙️ Config → Clientes</strong><br/>
          2. Vincule a uma rede em <strong>⚙️ Config → Redes</strong><br/>
          3. Envie o link de acesso para o cliente:<br/>
          <span style={{fontFamily:'monospace',fontSize:11,wordBreak:'break-all',color:'var(--blue)'}}>
            {window.location.origin+window.location.pathname}?role=client
          </span>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-blue" onClick={reset}>Cadastrar outro cliente</button>
        </div>
      </div>

      : <div>
        <div className="notice ni" style={{marginTop:10}}>
          O cliente receberá acesso ao app com este e-mail e senha. Configure os preços depois em ⚙️ Config → Clientes.
        </div>

        <div className="stitle">🏪 Dados da loja</div>
        <div className="fgrp">
          <label className="flabel">Nome da loja *</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex: Cali Burritos"/>
        </div>
        <div className="fgrp">
          <label className="flabel">Endereço da loja (ponto de coleta padrão)</label>
          <input value={address} onChange={e=>setAddress(e.target.value)} placeholder="Rua, número, bairro"/>
        </div>
        <div className="fgrp">
          <label className="flabel">WhatsApp</label>
          <input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="(21) 99999-0000"/>
        </div>

        <div className="stitle">🔐 Acesso ao app</div>
        <div className="fgrp">
          <label className="flabel">E-mail *</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="email@loja.com"/>
        </div>
        <div className="fgrp">
          <label className="flabel">Senha inicial *</label>
          <div className="inp-wrap">
            <input type={showPass?'text':'password'} value={pass} onChange={e=>setPass(e.target.value)} placeholder="Mínimo 6 caracteres"/>
            <button className="eye-btn" onClick={()=>setShowPass(v=>!v)}>{showPass?'🙈':'👁'}</button>
          </div>
        </div>

        <div className="err-msg">{err}</div>
        <button className="btn btn-blue" style={{margin:'6px 20px',width:'calc(100% - 40px)'}} onClick={submit} disabled={loading}>
          {loading ? 'Cadastrando...' : 'Cadastrar cliente'}
        </button>
      </div>}

    </div>
  </AdminShell>;
}
