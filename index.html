// Cache de settings carregado do Supabase
let _settings = {};
async function loadSettings() {
  const { data } = await db.from('settings').select('*');
  if (data) data.forEach(s => { _settings[s.id] = s.value; });
}
function getSetting(key, fallback) {
  return _settings[key] !== undefined ? _settings[key] : fallback;
}
// Busca tabela de preço para um cliente (cliente → rede → padrão)
async function getPriceTableForClient(clientId) {
  // 1. Tenta tabela personalizada do cliente
  if (clientId) {
    const { data: user } = await db.from('users').select('price_table_id,network_id').eq('id', clientId).single();
    if (user?.price_table_id) {
      const { data: items } = await db.from('price_items').select('*').eq('price_table_id', user.price_table_id);
      if (items?.length) return items;
    }
    // 2. Tenta tabela padrão da rede do cliente
    if (user?.network_id) {
      const { data: nt } = await db.from('price_tables').select('id').eq('network_id', user.network_id).eq('is_default', true).single();
      if (nt) {
        const { data: items } = await db.from('price_items').select('*').eq('price_table_id', nt.id);
        if (items?.length) return items;
      }
    }
  }
  // 3. Fallback: usa tabela hardcoded
  return Object.entries(BAIRRO_PRECO).map(([key, v]) => ({
    neighborhood_key: key,
    neighborhood_label: BAIRROS.find(([k]) => k === key)?.[1] || key,
    client_price: v.cliente,
    courier_price: v.entregador
  }));
}

const SL = {waiting:'Aguardando',accepted:'Aceito',collecting:'Coletando',delivering:'Em entrega',done:'Entregue',cancelled:'Cancelado'};
const SC = {waiting:'sw',accepted:'sa',collecting:'sc',delivering:'sd',done:'sdone',cancelled:'scanc'};

const ago = iso => { if(!iso)return''; const d=Math.floor((Date.now()-new Date(iso))/1000); if(d<60)return'agora'; if(d<3600)return Math.floor(d/60)+'min atrás'; if(d<86400)return Math.floor(d/3600)+'h atrás'; return Math.floor(d/86400)+'d atrás'; };
const getWeekBounds = (offset=0) => { const now=new Date(),day=now.getDay(),diff=day===0?-6:1-day,mon=new Date(now); mon.setDate(now.getDate()+diff+offset*7); mon.setHours(0,0,0,0); const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999); return{start:mon,end:sun}; };

// forced_level: quando admin define manualmente (sobrescreve o calculado)
// SQL necessário: 
//   alter table users add column if not exists forced_level int;

async function genCourierNumber() {
  // Busca o maior número atual e incrementa
  const { data } = await db.from('users').select('courier_number').eq('role','courier').not('courier_number','is',null).order('courier_number',{ascending:false}).limit(1);
  if (!data || !data.length || !data[0].courier_number) return '001';
  const last = parseInt(data[0].courier_number) || 0;
  return String(last + 1).padStart(3, '0');
}

// ===== CONTEXTS =====
const ToastCtx = createContext(null);
function ToastProvider({children}) {
  const [toasts, setToasts] = useState([]);
  const show = useCallback(msg => { const id=Date.now(); setToasts(t=>[...t,{id,msg}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000); },[]);
  return <ToastCtx.Provider value={show}>{children}<div className="toast-wrap">{toasts.map(t=><div key={t.id} className="toast">{t.msg}</div>)}</div></ToastCtx.Provider>;
}
const useToast = () => useContext(ToastCtx);

const AuthCtx = createContext(null);
function AuthProvider({children}) {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const loadProfile = async s => { const {data} = await db.from('users').select('*').eq('auth_id',s.user.id).single(); setProfile(data); setLoading(false); };
  useEffect(() => {
    loadSettings(); // Carrega configurações do Supabase
    db.auth.getSession().then(({data}) => { setSession(data.session); if(data.session) loadProfile(data.session); else setLoading(false); });
    const {data:l} = db.auth.onAuthStateChange(async(ev,s) => { setSession(s); if(ev==='SIGNED_IN'&&s) loadProfile(s); if(ev==='SIGNED_OUT'){setProfile(null);setLoading(false);} });
    return () => l.subscription.unsubscribe();
  },[]);
  const logout = async () => await db.auth.signOut();
  return <AuthCtx.Provider value={{session,profile,loading,logout}}>{children}</AuthCtx.Provider>;
}
const useAuth = () => useContext(AuthCtx);

}
function BairroSelect({value,onChange,id}) {
  const [search,setSearch]=useState('');
  const filtered=BAIRROS.filter(([v,l])=>l.toLowerCase().includes(search.toLowerCase())||v.toLowerCase().includes(search.toLowerCase()));
  const label=value?BAIRROS.find(([v])=>v===value)?.[1]||value:'';
  return <div style={{position:'relative'}}>
    <div style={{display:'flex',gap:6}}>
      <input
        value={search||label}
        onChange={e=>{setSearch(e.target.value);if(!e.target.value)onChange('');}}
        placeholder="Digite ou escolha o bairro..."
        style={{flex:1}}
        onFocus={e=>e.target.select()}
      />
      {value&&<button onClick={()=>{onChange('');setSearch('');}} style={{padding:'0 10px',borderRadius:'var(--rs)',border:'1px solid var(--border)',background:'var(--bg2)',cursor:'pointer',fontSize:16,color:'var(--text2)'}}>✕</button>}
    </div>
    {search&&!value&&filtered.length>0&&<div style={{position:'absolute',top:'100%',left:0,right:0,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'var(--rs)',boxShadow:'0 4px 16px rgba(0,0,0,.1)',zIndex:50,maxHeight:200,overflowY:'auto'}}>
      {filtered.map(([v,l])=><div key={v} onClick={()=>{onChange(v);setSearch('');}} style={{padding:'10px 14px',cursor:'pointer',fontSize:14,borderBottom:'1px solid var(--border)'}} onMouseOver={e=>e.target.style.background='var(--bg2)'} onMouseOut={e=>e.target.style.background=''}>
        {l}

// ===== LIVE MAP =====
function LiveMap({courierLat,courierLng,courierName,status}) {
  const mapRef = useRef(null), mapObj = useRef(null), marker = useRef(null);
  useEffect(() => {
    if(mapObj.current||!mapRef.current) return;
    const L = window.L; if(!L) return;
    const lat=courierLat||-22.9035, lng=courierLng||-43.1337;
    const map = L.map(mapRef.current,{zoomControl:true,attributionControl:false}).setView([lat,lng],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    mapObj.current = map;
    if(courierLat&&courierLng) {
      const icon=L.divIcon({html:`<div style="background:#3B6D11;width:36px;height:36px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3)">🛵</div>`,iconSize:[36,36],iconAnchor:[18,18],className:''});
      marker.current = L.marker([courierLat,courierLng],{icon}).addTo(map).bindPopup(`<strong>${courierName||'Entregador'}</strong>`);
      map.setView([courierLat,courierLng],15);
    }
    return () => { if(mapObj.current){mapObj.current.remove();mapObj.current=null;} };
  },[]);
  useEffect(() => {
    const L=window.L; if(!L||!mapObj.current||!courierLat||!courierLng) return;
    const pos=[courierLat,courierLng];
    if(marker.current) marker.current.setLatLng(pos);
    else { const icon=L.divIcon({html:`<div style="background:#3B6D11;width:36px;height:36px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3)">🛵</div>`,iconSize:[36,36],iconAnchor:[18,18],className:''}); marker.current=L.marker(pos,{icon}).addTo(mapObj.current); }
    mapObj.current.panTo(pos,{animate:true,duration:1});
  },[courierLat,courierLng]);
  const noLoc = !courierLat||!courierLng;
  return <div style={{margin:'10px 14px',borderRadius:12,overflow:'hidden',border:'1px solid var(--border)',position:'relative'}}>
    <div ref={mapRef} style={{height:200,width:'100%',background:'var(--bg2)'}}/>
    {(noLoc||status==='waiting')&&<div style={{position:'absolute',inset:0,background:'rgba(255,255,255,.85)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8}}>
      <div style={{fontSize:28}}>{status==='waiting'?'⏳':'📍'}</div>
      <div style={{fontSize:13,color:'#666',fontWeight:600}}>{status==='waiting'?'Aguardando entregador...':'Localizando entregador...'}</div>
    </div>}
  </div>;
}

function playAlert() {
  try { const ctx=new(window.AudioContext||window.webkitAudioContext)(); const play=(f,s,d)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+s);g.gain.linearRampToValueAtTime(0.4,ctx.currentTime+s+0.01);g.gain.linearRampToValueAtTime(0,ctx.currentTime+s+d);o.start(ctx.currentTime+s);o.stop(ctx.currentTime+s+d+0.05);};play(520,0,0.12);play(660,0.15,0.12);play(800,0.30,0.20); } catch(e) {}
}

// ===== CLIENT CLOSING =====
function ClientClosing({setPage}) {
  const {profile} = useAuth(); const toast = useToast();
  const [tab, setTab] = useState('pending'); // pending | history
  const [pending, setPending] = useState([]);
  const [myClosings, setMyClosings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [contesting, setContesting] = useState(null); // {closing, quantities}
  const [contestQty, setContestQty] = useState({});

  useEffect(()=>{ loadAll(); },[profile]);

  const loadAll = async () => {
    if (!profile) return;
    setLoading(true);
    // Lançamentos do entregador aguardando confirmação do cliente
    const {data:pend} = await db.from('daily_closings')
      .select('*')
      .eq('client_id', profile.id)
      .eq('status', 'pending')
      .not('courier_submission', 'is', null)
      .order('date', {ascending:false});
    setPending(pend||[]);
    // Histórico
    const {data:hist} = await db.from('daily_closings')
      .select('*')
      .eq('client_id', profile.id)
      .in('status', ['matched','diverged','agreed','disputed'])
      .order('date', {ascending:false})
      .limit(30);
    setMyClosings(hist||[]);
    setLoading(false);
  };

  const confirm = async (closing) => {
    // Cliente confirma exatamente o que o entregador lançou
    await db.from('daily_closings').update({
      client_submission: closing.courier_submission,
      status: 'matched',
      agreed_data: closing.courier_submission,
      updated_at: new Date().toISOString()
    }).eq('id', closing.id);
    toast('✅ Fechamento confirmado!');
    loadAll();
  };

  const startContest = (closing) => {
    // Pré-preenche com os valores do entregador para o cliente ajustar
    const qty = {};
    (closing.courier_submission||[]).forEach(s => { qty[s.key] = s.qty; });
    setContestQty(qty);
    setContesting(closing);
  };

  const submitContest = async () => {
    if (!contesting) return;
    const submission = Object.entries(contestQty).filter(([,v])=>+v>0).map(([k,v])=>{
      const orig = (contesting.courier_submission||[]).find(x=>x.key===k);
      return {key:k, label:orig?.label||k, qty:+v};
    });
    // Check if matches courier
    const cs = contesting.courier_submission||[];
    const match = submission.every(s=>{const cf=cs.find(x=>x.key===s.key);return cf&&cf.qty===s.qty;}) && cs.every(s=>{const cl=submission.find(x=>x.key===s.key);return cl&&cl.qty===s.qty;});
    await db.from('daily_closings').update({
      client_submission: submission,
      status: match ? 'matched' : 'diverged',
      ...(match && {agreed_data: submission}),
      updated_at: new Date().toISOString()
    }).eq('id', contesting.id);
    toast(match ? '✅ Confirmado!' : '⚠️ Contestação enviada ao entregador.');
    setContesting(null); setContestQty({});
    loadAll();
  };

  const statusInfo = {
    pending:{icon:'⏳',label:'Aguardando',color:'var(--amber)',bg:'var(--amber-l)'},
    matched:{icon:'✅',label:'Confirmado',color:'var(--green)',bg:'var(--green-l)'},
    diverged:{icon:'⚠️',label:'Divergência',color:'var(--red)',bg:'var(--red-l)'},
    agreed:{icon:'✅',label:'Acordado',color:'var(--green)',bg:'var(--green-l)'},
    disputed:{icon:'🔴',label:'Em disputa',color:'var(--red)',bg:'var(--red-l)'}
  };

  const ts = t => ({padding:'9px 14px',fontSize:13,fontWeight:tab===t?600:400,cursor:'pointer',color:tab===t?'var(--blue)':'var(--text2)',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',fontFamily:'var(--font)'});

  return <div className="screen">
    <Topbar title="Fechamento diário" onBack={()=>setPage('client-orders')} badge="Cliente" badgeClass="bc"/>
    <div className="scroll">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)'}}>
        <button style={ts('pending')} onClick={()=>setTab('pending')}>
          Pendentes {pending.length>0&&<span style={{marginLeft:4,background:'var(--red)',color:'white',borderRadius:10,fontSize:10,padding:'1px 6px',fontWeight:700}}>{pending.length}</span>}
        </button>
        <button style={ts('history')} onClick={()=>setTab('history')}>Histórico</button>
      </div>

      {loading?<Loading/>:<>

        {/* PENDING TAB */}
        {tab==='pending'&&<>
          {pending.length===0
            ?<Empty icon="✅" text="Nenhum lançamento pendente. Os entregadores ainda não enviaram o fechamento de hoje."/>
            :pending.map(cl=>{
              const total=(cl.courier_submission||[]).reduce((a,x)=>a+x.qty,0);
              return <div key={cl.id} className="ocard" style={{margin:'8px 14px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700}}>{cl.courier_name}{cl.courier_number?' #'+cl.courier_number:''}</div>
                    <div style={{fontSize:11,color:'var(--text2)'}}>{fmtDate(cl.date)} · {total} entrega{total!==1?'s':''}</div>
                  </div>
                  <span style={{fontSize:11,padding:'3px 9px',borderRadius:20,fontWeight:600,background:'var(--amber-l)',color:'var(--amber)'}}>⏳ Aguarda você</span>
                </div>
                {/* Show what courier submitted */}
                <div style={{background:'var(--bg2)',borderRadius:'var(--rs)',padding:'10px 12px',marginBottom:12}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Lançado pelo entregador</div>
                  {(cl.courier_submission||[]).map((s,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'3px 0',borderBottom:i<(cl.courier_submission||[]).length-1?'1px solid var(--border)':''}}>
                    <span>{s.label}</span><span style={{fontWeight:700}}>{s.qty}x</span>
                  </div>)}
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:700,marginTop:8,paddingTop:6,borderTop:'1px solid var(--border)'}}>
                    <span>Total</span><span style={{color:'var(--green)'}}>{total} entregas</span>
                  </div>
                </div>
                {/* Contest form */}
                {contesting?.id===cl.id?<>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Seu lançamento (ajuste se necessário)</div>
                  {(cl.courier_submission||[]).map(s=><div key={s.key} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
                    <div style={{flex:1,fontSize:13,fontWeight:500}}>{s.label}</div>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <button onClick={()=>setContestQty(q=>({...q,[s.key]:Math.max(0,(q[s.key]||0)-1)}))} style={{width:26,height:26,borderRadius:'50%',border:'1px solid var(--border)',background:'var(--bg2)',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
                      <input type="number" min="0" value={contestQty[s.key]||0} onChange={e=>setContestQty(q=>({...q,[s.key]:Math.max(0,parseInt(e.target.value)||0)}))} style={{width:46,textAlign:'center',padding:'4px',fontSize:14,fontWeight:700}}/>
                      <button onClick={()=>setContestQty(q=>({...q,[s.key]:(q[s.key]||0)+1}))} style={{width:26,height:26,borderRadius:'50%',border:'1px solid var(--blue-l)',background:'var(--blue-l)',cursor:'pointer',fontSize:14,color:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
                    </div>
                  </div>)}
                  <div style={{display:'flex',gap:8,marginTop:12}}>
                    <button className="btn-sm progress" style={{flex:1,padding:'9px'}} onClick={submitContest}>Enviar meu lançamento</button>
                    <button className="btn-sm" style={{flex:1,padding:'9px'}} onClick={()=>setContesting(null)}>Cancelar</button>
                  </div>
                </>:<div style={{display:'flex',gap:8}}>
                  <button className="btn btn-blue" style={{flex:1,padding:'10px',fontSize:13}} onClick={()=>confirm(cl)}>✅ Confirmar tudo</button>
                  <button className="btn-sm" style={{flex:1,padding:'10px',fontSize:13}} onClick={()=>startContest(cl)}>✏️ Contestar</button>
                </div>}
              </div>;
            })
          }
        </>}

        {/* HISTORY TAB */}
        {tab==='history'&&<>
          {myClosings.length===0?<Empty icon="📋" text="Nenhum fechamento no histórico ainda."/>:
            myClosings.map(cl=>{
              const si=statusInfo[cl.status]||{icon:'?',label:cl.status,color:'var(--text2)',bg:'var(--bg2)'};
              const total=(cl.agreed_data||cl.courier_submission||[]).reduce((a,x)=>a+x.qty,0);
              return <div key={cl.id} className="ocard" style={{margin:'0 14px 8px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:600}}>{cl.courier_name}{cl.courier_number?' #'+cl.courier_number:''}</div>
                    <div style={{fontSize:11,color:'var(--text2)'}}>{fmtDate(cl.date)} · {total} entrega{total!==1?'s':''}</div>
                  </div>
                  <span style={{fontSize:11,padding:'3px 9px',borderRadius:20,fontWeight:600,background:si.bg,color:si.color}}>{si.icon} {si.label}</span>
                </div>
                {cl.status==='diverged'&&<div style={{fontSize:11,color:'var(--red)',marginTop:6}}>
                  Entregador: {(cl.courier_submission||[]).reduce((a,x)=>a+x.qty,0)} · Você: {(cl.client_submission||[]).reduce((a,x)=>a+x.qty,0)} entregas
                </div>}
              </div>;
            })
          }
        </>}
      </>}
    </div>
  </div>;
}

function CourierClosing({setPage}) {
  const {profile} = useAuth(); const toast = useToast();
  const [clients, setClients] = useState([]);
  const [selClient, setSelClient] = useState('');
  const [priceItems, setPriceItems] = useState([]);
  const [quantities, setQuantities] = useState({});
  const [date, setDate] = useState(new Date().toISOString().slice(0,10));
  const [loading, setLoading] = useState(false);
  const [myClosings, setMyClosings] = useState([]);
  const [existing, setExisting] = useState(null);
  const [tab, setTab] = useState('launch'); // launch | history

  useEffect(()=>{ loadAll(); },[profile]);

  const loadAll = async () => {
    if (!profile) return;
    // Todos os clientes disponíveis
    const {data:cls} = await db.from('users').select('id,name').eq('role','client').order('name');
    setClients(cls||[]);
    // Meus fechamentos recentes
    const {data:hist} = await db.from('daily_closings').select('*').eq('courier_id',profile.id).order('date',{ascending:false}).limit(30);
    setMyClosings(hist||[]);
  };

  const onSelectClient = async (id) => {
    setSelClient(id); setQuantities({}); setPriceItems([]); setExisting(null);
    if (!id) return;
    const items = await getPriceTableForClient(id);
    setPriceItems(items.map(i=>({...i,_hidePrice:true})));
    checkExisting(id, date);
  };

  const checkExisting = async (clientId, dateVal) => {
    if (!clientId||!dateVal) return;
    const {data} = await db.from('daily_closings').select('*').eq('courier_id',profile.id).eq('client_id',clientId).eq('date',dateVal).maybeSingle();
    setExisting(data);
  };

  useEffect(()=>{ if(selClient) checkExisting(selClient,date); },[date]);

  const totalQty = Object.values(quantities).reduce((a,v)=>a+(+v||0),0);

  const submit = async () => {
    if (!selClient) { toast('Selecione o cliente'); return; }
    if (totalQty===0) { toast('Informe ao menos 1 entrega'); return; }
    setLoading(true);
    const client = clients.find(x=>x.id===selClient);
    const submission = Object.entries(quantities).filter(([,v])=>+v>0).map(([k,v])=>{
      const item=priceItems.find(p=>(p.neighborhood_key||p.key)===k);
      return {key:k, label:item?.neighborhood_label||item?.label||k, qty:+v};
    });
    const payload = {
      courier_id:profile.id, courier_name:profile.name,
      courier_number:profile.courier_number||null,
      client_id:selClient, client_name:client?.name||'',
      date, courier_submission:submission,
      status:'pending', // sempre pending — cliente confirma
      updated_at:new Date().toISOString()
    };
    if(existing) {
      await db.from('daily_closings').update(payload).eq('id',existing.id);
    } else {
      await db.from('daily_closings').insert(payload);
    }
    setLoading(false);
    toast('Lançamento enviado! O cliente receberá para confirmar. 📋');
    setSelClient(''); setQuantities({}); setPriceItems([]); setExisting(null);
    loadAll();
  };

  const statusInfo = {
    pending:{icon:'⏳',label:'Aguardando cliente',color:'var(--amber)',bg:'var(--amber-l)'},
    matched:{icon:'✅',label:'Confirmado',color:'var(--green)',bg:'var(--green-l)'},
    diverged:{icon:'⚠️',label:'Divergência',color:'var(--red)',bg:'var(--red-l)'},
    agreed:{icon:'✅',label:'Acordado',color:'var(--green)',bg:'var(--green-l)'},
    disputed:{icon:'🔴',label:'Em disputa',color:'var(--red)',bg:'var(--red-l)'}
  };

  const ts = t => ({padding:'9px 14px',fontSize:13,fontWeight:tab===t?600:400,cursor:'pointer',color:tab===t?'var(--blue)':'var(--text2)',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',fontFamily:'var(--font)'});

  const pendingCount = myClosings.filter(c=>c.status==='pending').length;

  return <div className="screen">
    <Topbar title="Fechamento do dia" onBack={()=>setPage('courier')} badge="Entregador" badgeClass="bd"/>
    <div className="scroll">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)'}}>
        <button style={ts('launch')} onClick={()=>setTab('launch')}>📋 Lançar</button>
        <button style={ts('history')} onClick={()=>setTab('history')}>
          Histórico {pendingCount>0&&<span style={{marginLeft:4,background:'var(--amber)',color:'white',borderRadius:10,fontSize:10,padding:'1px 6px',fontWeight:700}}>{pendingCount}</span>}
        </button>
      </div>

      {tab==='launch'&&<>
        <div className="notice ni" style={{marginTop:10,fontSize:12}}>
          Registre suas entregas. O cliente recebe para confirmar com 1 clique.
        </div>
        <div className="stitle">👤 Cliente</div>
        <div className="fgrp">
          <select value={selClient} onChange={e=>onSelectClient(e.target.value)}>
            <option value="">— Selecione o cliente —</option>
            {clients.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
          </select>
        </div>
        <div className="stitle">📅 Data</div>
        <div className="fgrp"><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>

        {existing&&<div style={{margin:'0 14px 10px',padding:'10px 14px',borderRadius:'var(--rs)',background:statusInfo[existing.status]?.bg||'var(--amber-l)'}}>
          <div style={{fontSize:13,fontWeight:600,color:statusInfo[existing.status]?.color}}>{statusInfo[existing.status]?.icon} Já existe lançamento: {statusInfo[existing.status]?.label}</div>
          {existing.status==='diverged'&&<div style={{fontSize:11,marginTop:4,color:'var(--red)'}}>Você: {(existing.courier_submission||[]).reduce((a,x)=>a+x.qty,0)} · Cliente: {(existing.client_submission||[]).reduce((a,x)=>a+x.qty,0)}</div>}
        </div>}

        {priceItems.length>0&&<>
          <div className="stitle">📦 Suas entregas por região</div>
          <div className="notice ni" style={{margin:'0 14px 8px',fontSize:12}}>Informe a quantidade — os valores são controlados pelo admin.</div>
          <div style={{padding:'0 14px'}}>
            {priceItems.map(item=>{
              const key=item.neighborhood_key||item.key;
              const qty=quantities[key]||0;
              return <div key={key} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
                <div style={{flex:1,fontSize:13,fontWeight:500}}>{item.neighborhood_label||item.label}</div>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <button onClick={()=>setQuantities(q=>({...q,[key]:Math.max(0,(q[key]||0)-1)}))} style={{width:28,height:28,borderRadius:'50%',border:'1px solid var(--border)',background:'var(--bg2)',cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
                  <input type="number" min="0" value={qty||''} onChange={e=>setQuantities(q=>({...q,[key]:Math.max(0,parseInt(e.target.value)||0)}))} placeholder="0" style={{width:52,textAlign:'center',padding:'5px 4px',fontSize:15,fontWeight:700}}/>
                  <button onClick={()=>setQuantities(q=>({...q,[key]:(q[key]||0)+1}))} style={{width:28,height:28,borderRadius:'50%',border:'1px solid var(--blue-l)',background:'var(--blue-l)',cursor:'pointer',fontSize:16,color:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
                </div>
              </div>;
            })}
          </div>
          {totalQty>0&&<div className="pbox" style={{margin:'12px 14px'}}>
            <div className="ptotal"><span>Total de entregas</span><span style={{color:'var(--green)',fontSize:18}}>{totalQty}</span></div>
          </div>}
          <button className="btn btn-green" style={{margin:'6px 20px',width:'calc(100% - 40px)'}} onClick={submit} disabled={loading||totalQty===0}>
            {loading?'Enviando...':'📋 Enviar para o cliente confirmar'}
          </button>
        </>}
        {selClient&&priceItems.length===0&&<div className="notice ne">Este cliente não tem tabela de preços configurada.</div>}
      </>}

      {tab==='history'&&<>
        {myClosings.length===0?<Empty icon="📋" text="Nenhum fechamento ainda."/>:
          myClosings.map(cl=>{
            const si=statusInfo[cl.status]||{icon:'?',label:cl.status,color:'var(--text2)',bg:'var(--bg2)'};
            const total=(cl.courier_submission||[]).reduce((a,x)=>a+x.qty,0);
            return <div key={cl.id} className="ocard" style={{margin:'8px 14px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600}}>{cl.client_name}</div>
                  <div style={{fontSize:11,color:'var(--text2)'}}>{fmtDate(cl.date)} · {total} entrega{total!==1?'s':''}</div>
                </div>
                <span style={{fontSize:11,padding:'3px 9px',borderRadius:20,fontWeight:600,background:si.bg,color:si.color}}>{si.icon} {si.label}</span>
              </div>
              {cl.status==='diverged'&&<div style={{fontSize:11,color:'var(--red)',marginTop:6}}>
                Você: {total} · Cliente confirmou: {(cl.client_submission||[]).reduce((a,x)=>a+x.qty,0)} entregas
              </div>}
            </div>;
          })
        }
      </>}
    </div>
  </div>;
}

function ClientOrders({setPage,setTrackId}) {
  const {profile}=useAuth(); const [orders,setOrders]=useState([]); const [loading,setLoading]=useState(true);
  const load=useCallback(async()=>{if(!profile)return;const{data}=await db.from('orders').select('*').eq('client_id',profile.id).order('created_at',{ascending:false}).limit(100);setOrders(data||[]);setLoading(false);},[profile]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{if(!profile)return;const sub=db.channel('co').on('postgres_changes',{event:'*',schema:'public',table:'orders'},load).subscribe();return()=>db.removeChannel(sub);},[profile,load]);
  return <div className="screen">
    <Topbar title={<><span className="rdot"></span>Meus pedidos</>} badge={profile?.name?.split(' ')[0]} badgeClass="bc"/>
    <div className="scroll">
      {loading?<Loading/>:orders.length===0?<Empty icon="📦" text="Nenhum pedido ainda. Crie seu primeiro!"/>:<>
        {/* Group by date */}
        {Object.entries(orders.reduce((acc,o)=>{const d=o.created_at?.slice(0,10)||'';if(!acc[d])acc[d]=[];acc[d].push(o);return acc;},{})).map(([date,dayOrders])=><div key={date}>
          <div style={{padding:'10px 14px 4px',fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em'}}>{fmtDate(date)}</div>
          {dayOrders.map(o=><OrderCard key={o.id} order={o} actions={
            ['waiting','accepted','collecting','delivering'].includes(o.status)
              ?[<button key="t" className="btn-sm" onClick={()=>{setTrackId(o.id);setPage('track');}}>Rastrear</button>]
              :[<span key="d" style={{fontSize:12,color:'var(--text2)'}}>{o.status==='done'?'✓ Concluído':'✗ Cancelado'}</span>]
          }/>)}
        </div>)}
      </>}
    </div>
    <div className="tabbar">
      <button className="tab-item" onClick={()=>setPage('new-order')}><span className="tab-icon">➕</span><span>Novo pedido</span></button>
      <button className="tab-item active"><span className="tab-icon">📋</span><span>Pedidos</span></button>
      <button className="tab-item" onClick={()=>setPage('client-closing')}><span className="tab-icon">✅</span><span>Fechamento</span></button>
      <button className="tab-item" onClick={()=>setPage('profile')}><span className="tab-icon">👤</span><span>Perfil</span></button>
    </div>
  </div>;
}

function NewOrder({setPage}) {
  const {profile}=useAuth(); const toast=useToast();
  const DEFAULT_PICKUP = profile?.address || 'Loja Icaraí';
  const [pickup,setPickup]=useState('');
  const [bairro,setBairro]=useState('');
  const [delivery,setDelivery]=useState('');
  const [item,setItem]=useState('');
  const [pay,setPay]=useState('App');
  const [loading,setLoading]=useState(false);
  const prices=bairro?BAIRRO_PRECO[bairro]:null;
  const bairroLabel=bairro?BAIRROS.find(([v])=>v===bairro)?.[1]||bairro:'';

  // Set default pickup from profile
  useEffect(()=>{
    if(profile?.address) setPickup(profile.address);
  },[profile]);

  const submit=async()=>{
    if(!bairro){toast('Selecione o bairro de entrega');return;}
    if(!item){toast('Descreva o que será coletado');return;}
    setLoading(true);
    // Busca preços reais do Supabase (tabela do cliente → rede → padrão)
    const priceTable=await getPriceTableForClient(profile.id);
    const bairroPrice=priceTable.find(p=>(p.neighborhood_key||p.key)===bairro)||prices;
    const clientPrice=bairroPrice?+(bairroPrice.client_price||bairroPrice.cliente):prices?.cliente||0;
    const courierPrice=bairroPrice?+(bairroPrice.courier_price||bairroPrice.entregador):prices?.entregador||0;
    const{error}=await db.from('orders').insert({
      client_id:profile.id,client_name:profile.name,
      pickup_addr:pickup||'Icaraí (a confirmar)',
      delivery_addr:(delivery?delivery+' — ':'')+bairroLabel,
      neighborhood:bairro,item_desc:item,pay_method:pay,
      price:clientPrice,courier_price:courierPrice,status:'waiting'
    });
    setLoading(false);
    if(error){toast('Erro ao criar pedido');return;}
    toast('Pedido criado! Aguardando entregador 🎉');
    setPage('client-orders');
  };

  return <div className="screen">
    <Topbar title="Novo pedido" onBack={()=>setPage('client-orders')} badge="Cliente" badgeClass="bc"/>
    <div className="scroll">
      <div className="stitle">📍 Local de retirada</div>
      <div className="fgrp">
        <label className="flabel">Endereço completo (rua, número, complemento)</label>
        <input value={pickup} onChange={e=>setPickup(e.target.value)} placeholder="Rua, número, apto, referência..."/>
        {profile?.address&&pickup!==profile.address&&<button onClick={()=>setPickup(profile.address)} style={{marginTop:5,fontSize:12,color:'var(--blue)',background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline'}}>↩ Usar meu endereço padrão</button>}
      </div>
      <div className="stitle">🏠 Local de entrega</div>
      <div className="fgrp">
        <label className="flabel">Bairro</label>
        <BairroSelect id="p-bairro" value={bairro} onChange={setBairro}/>
      </div>
      <div className="fgrp">
        <label className="flabel">Endereço completo (rua, número, complemento)</label>
        <input value={delivery} onChange={e=>setDelivery(e.target.value)} placeholder="Rua, número, apto, referência... (opcional)"/>
      </div>
      <div className="stitle">📦 Pacote</div>
      <div className="fgrp"><label className="flabel">O que será coletado?</label><textarea value={item} onChange={e=>setItem(e.target.value)} placeholder="Ex: 2 marmitas, 1 envelope A4..."/></div>
      <div className="fgrp"><label className="flabel">Pagamento</label><select value={pay} onChange={e=>setPay(e.target.value)}><option>App</option><option>Pix</option><option>Dinheiro</option></select></div>
      {prices&&<div className="pbox">
        <div className="prow"><span>Bairro de entrega</span><span style={{fontWeight:700,color:'var(--text)'}}>{bairroLabel}</span></div>
        <div className="ptotal"><span>Valor da entrega</span><span style={{color:'var(--blue)',fontSize:18}}>{fmtMoney(prices.cliente)}</span></div>
        <div style={{fontSize:11,color:'var(--text2)',marginTop:8}}>✓ Valor fixo por bairro · sem cobranças extras</div>
      </div>}
      <button className="btn btn-blue" style={{margin:'6px 20px',width:'calc(100% - 40px)'}} onClick={submit} disabled={loading}>{loading?'Enviando...':'Solicitar entregador'}</button>
    </div>
  </div>;
}

function CourierCard({setPage}) {
  const {profile} = useAuth();
  const [stats, setStats] = useState(null);
  const [ranking, setRanking] = useState([]);
  const [rankTab, setRankTab] = useState('geral');
  const radarRef = useRef(null);
  const radarChart = useRef(null);

  const LEVELS = [
    {name:'Recruta',    min:0,    color:'#888780', bg:'#F1EFE8'},
    {name:'Ativo',      min:100,  color:'#185FA5', bg:'#E6F1FB'},
    {name:'Experiente', min:300,  color:'#3B6D11', bg:'#EAF3DE'},
    {name:'Veterano',   min:700,  color:'#854F0B', bg:'#FAEEDA'},
    {name:'Elite',      min:1500, color:'#534AB7', bg:'#EEEDFE'},
    {name:'Lendário',   min:3000, color:'#993556', bg:'#FBEAF0'},
  ];

  const getLevel = xp => { for(let i=LEVELS.length-1;i>=0;i--) if(xp>=LEVELS[i].min) return LEVELS[i]; return LEVELS[0]; };

  const calcAttrs = (s) => ({
    pontualidade: Math.min(99, 60 + Math.round((s.deliveries||0)*0.15 + (s.streak||0)*1.5)),
    cuidado:      Math.min(99, 70 + Math.round((s.deliveries||0)*0.05)),
    velocidade:   Math.min(99, 55 + Math.round((s.deliveries||0)*0.2)),
    aceitacao:    Math.min(99, Math.round(s.acceptRate||75)),
    rotas:        Math.min(99, 60 + (s.regions||0)*5 + Math.round((s.deliveries||0)*0.05)),
    consistencia: Math.min(99, 50 + (s.streak||0)*2 + Math.round((s.deliveries||0)*0.08)),
  });

  const calcOverall = attrs => Math.round(Object.values(attrs).reduce((a,v)=>a+v,0)/6);

  const calcXP = s => {
    let xp = (s.deliveries||0) * 10;
    if ((s.streak||0) >= 7)  xp += 70;
    if ((s.streak||0) >= 30) xp += 150;
    if ((s.regions||0) >= 3) xp += 30;
    if ((s.regions||0) >= 5) xp += 60;
    return xp;
  };

  useEffect(() => { loadStats(); }, [profile]);

  const loadStats = async () => {
    if (!profile) return;
    // My deliveries
    const {data:orders} = await db.from('orders').select('neighborhood,created_at,status').eq('courier_id', profile.id);
    const done = (orders||[]).filter(o=>o.status==='done');
    const deliveries = done.length;
    const regions = new Set(done.map(o=>o.neighborhood).filter(Boolean)).size;
    // Accept rate
    const {data:allOrders} = await db.from('orders').select('status').eq('courier_id', profile.id);
    const total = (allOrders||[]).length;
    const acceptRate = total > 0 ? Math.round(done.length / total * 100) : 100;
    // Streak — days with at least 1 delivery
    const days = new Set(done.map(o=>o.created_at?.slice(0,10))).size;
    const streak = Math.min(days, 30);
    setStats({deliveries, regions, acceptRate, streak});
    // Load ranking
    const {data:couriers} = await db.from('users').select('id,name,courier_number').eq('role','courier');
    const {data:allDone} = await db.from('orders').select('courier_id,neighborhood').eq('status','done');
    const rankData = (couriers||[]).map(co => {
      const myOrders = (allDone||[]).filter(o=>o.courier_id===co.id);
      const d = myOrders.length;
      const r = new Set(myOrders.map(o=>o.neighborhood).filter(Boolean)).size;
      const xp = d*10 + (r>=3?30:0) + (r>=5?60:0);
      return {id:co.id, name:co.name, number:co.courier_number, deliveries:d, regions:r, xp, isMe:co.id===profile.id};
    }).sort((a,b)=>b.xp-a.xp);
    setRanking(rankData);
  };

  useEffect(() => {
    if (!stats || !radarRef.current) return;
    const attrs = calcAttrs(stats);
    if (radarChart.current) { radarChart.current.destroy(); radarChart.current = null; }
    const L = window.Chart;
    if (!L) return;
    radarChart.current = new L(radarRef.current, {
      type:'radar',
      data:{
        labels:['Pontual.','Cuidado','Veloc.','Aceite','Rotas','Consist.'],
        datasets:[{data:Object.values(attrs),backgroundColor:'rgba(24,95,165,0.12)',borderColor:'#185FA5',borderWidth:1.5,pointBackgroundColor:'#185FA5',pointRadius:3}]
      },
      options:{responsive:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{display:false,stepSize:25},grid:{color:'rgba(128,128,128,0.2)'},pointLabels:{font:{size:10},color:'#888780'},angleLines:{color:'rgba(128,128,128,0.2)'}}}}
    });
    return () => { if(radarChart.current){radarChart.current.destroy();radarChart.current=null;} };
  }, [stats]);

  if (!stats) return <div className="screen"><Topbar title="Meu card" onBack={()=>setPage('courier')} badge="Entregador" badgeClass="bd"/><Loading/></div>;

  const attrs   = calcAttrs(stats);
  const overall = calcOverall(attrs);
  const xp      = calcXP(stats);
  const lv      = getLevel(xp);
  const nextLv  = LEVELS[LEVELS.indexOf(lv)+1];
  const pct     = nextLv ? Math.round((xp-lv.min)/(nextLv.min-lv.min)*100) : 100;

  const ATTR_LIST = [
    {key:'pontualidade', label:'Pontualidade',     color:'#185FA5'},
    {key:'cuidado',      label:'Cuidado c/ pacote',color:'#3B6D11'},
    {key:'velocidade',   label:'Velocidade',        color:'#854F0B'},
    {key:'aceitacao',    label:'Taxa de aceite',    color:'#534AB7'},
    {key:'rotas',        label:'Conh. de rotas',    color:'#993556'},
    {key:'consistencia', label:'Consistência',      color:'#185FA5'},
  ];

  const medals = ['🥇','🥈','🥉'];
  const myRankPos = ranking.findIndex(r=>r.isMe);

  return <div className="screen">
    <Topbar title="Meu card" onBack={()=>setPage('courier')} badge="Entregador" badgeClass="bd"/>
    <div className="scroll">

      {/* Main card — FIFA style */}
      <div style={{margin:'12px 14px',padding:'16px',background:'var(--bg2)',borderRadius:'var(--r)',border:'1px solid var(--border)',display:'flex',gap:14,flexWrap:'wrap'}}>

        {/* Left: avatar + overall + level */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,minWidth:90}}>
          <div style={{width:56,height:56,borderRadius:'50%',background:'var(--bg)',border:`2px solid ${lv.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:700,color:lv.color}}>
            {profile?.name?.split(' ').map(n=>n[0]).join('').slice(0,2)}
          </div>
          <div style={{fontSize:40,fontWeight:700,color:'var(--text)',lineHeight:1}}>{overall}</div>
          <div style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:20,background:lv.bg,color:lv.color,border:`1px solid ${lv.color}`}}>{lv.name}</div>
          <div style={{fontSize:12,fontWeight:600,color:'var(--text2)'}}>#{profile?.courier_number||'—'}</div>
          <div style={{fontSize:12,color:'var(--text)',fontWeight:600,textAlign:'center'}}>{profile?.name}</div>
          {/* XP bar */}
          <div style={{width:'100%'}}>
            <div style={{height:4,background:'var(--bg)',borderRadius:2,overflow:'hidden',marginTop:4}}>
              <div style={{height:'100%',width:pct+'%',background:lv.color,borderRadius:2}}></div>
            </div>
            <div style={{fontSize:10,color:'var(--text2)',marginTop:3,textAlign:'center'}}>{xp} XP</div>
          </div>
        </div>

        {/* Mid: attribute bars */}
        <div style={{flex:1,minWidth:150}}>
          {ATTR_LIST.map(a=><div key={a.key} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:'1px solid var(--border)'}}>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text)',width:26,textAlign:'right',flexShrink:0}}>{attrs[a.key]}</div>
            <div style={{flex:1,height:5,background:'var(--bg)',borderRadius:3,overflow:'hidden'}}>
              <div style={{height:'100%',width:attrs[a.key]+'%',background:a.color,borderRadius:3}}></div>
            </div>
            <div style={{fontSize:11,color:'var(--text2)',width:100,flexShrink:0}}>{a.label}</div>
          </div>)}
        </div>

        {/* Right: radar */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
          <div style={{fontSize:10,color:'var(--text2)'}}>Radar</div>
          <canvas ref={radarRef} width={140} height={140} role="img" aria-label="Radar de atributos"/>
        </div>
      </div>

      {/* Stats strip */}
      <div className="mrow">
        <div className="mcard"><div className="mval">{stats.deliveries}</div><div className="mlbl">entregas</div></div>
        <div className="mcard"><div className="mval" style={{color:'var(--green)'}}>{stats.streak}</div><div className="mlbl">dias seguidos</div></div>
        <div className="mcard"><div className="mval" style={{color:'var(--blue)'}}>{stats.regions}</div><div className="mlbl">regiões</div></div>
        <div className="mcard"><div className="mval" style={{color:'var(--amber)'}}>{stats.acceptRate}%</div><div className="mlbl">aceite</div></div>
      </div>

      {/* Ranking */}
      <div className="stitle">Ranking de entregadores</div>
      <div style={{display:'flex',gap:0,borderBottom:'1px solid var(--border)',margin:'0 14px 10px'}}>
        {[['geral','Geral'],['semana','Esta semana']].map(([v,l])=>
          <button key={v} onClick={()=>setRankTab(v)} style={{padding:'8px 14px',fontSize:13,fontWeight:rankTab===v?600:400,cursor:'pointer',color:rankTab===v?'var(--blue)':'var(--text2)',borderBottom:rankTab===v?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',borderBottom:rankTab===v?'2px solid var(--blue)':'2px solid transparent',fontFamily:'var(--font)'}}>
            {l}
          </button>
        )}
      </div>
      {ranking.slice(0,10).map((r,i)=><div key={r.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid var(--border)',background:r.isMe?'var(--blue-l)':'transparent'}}>
        <div style={{width:24,textAlign:'center',fontSize:14,fontWeight:700,color:i<3?['#BA7517','#888780','#993C1D'][i]:'var(--text2)',flexShrink:0}}>
          {i<3?medals[i]:i+1}
        </div>
        <div style={{width:32,height:32,borderRadius:'50%',background:r.isMe?'var(--blue)':'var(--bg2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:r.isMe?'white':'var(--text2)',flexShrink:0}}>
          {r.name?.split(' ').map(n=>n[0]).join('').slice(0,2)}
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:r.isMe?700:500,color:'var(--text)'}}>{r.name}{r.isMe?' (você)':''}</div>
          <div style={{fontSize:11,color:'var(--text2)'}}>#{r.number||'—'} · {r.deliveries} entregas · {r.regions} regiões</div>
        </div>
        <div style={{fontSize:13,fontWeight:600,color:i===0?'#BA7517':'var(--text2)'}}>{r.xp} XP</div>
      </div>)}

      {myRankPos >= 0 && myRankPos >= 10 && <div style={{margin:'8px 14px',padding:'10px 14px',background:'var(--blue-l)',borderRadius:'var(--rs)',fontSize:13,color:'var(--blue)',fontWeight:600}}>
        Sua posição no ranking: #{myRankPos+1}
      </div>}

    </div>
  </div>;
}

function CourierDash({setPage}) {
  const {profile}=useAuth(); const toast=useToast();
  const [online,setOnline]=useState(true);
  const [available,setAvailable]=useState([]);
  const [active,setActive]=useState(null);
  const [stats,setStats]=useState({d:0,e:0});
  const [loading,setLoading]=useState(true);
  const prevCount=useRef(null);
  const watchRef=useRef(null);

  const loadAvail=useCallback(async()=>{if(!online){setAvailable([]);return;}const{data}=await db.from('orders').select('*').eq('status','waiting').order('created_at');const arr=data||[];if(prevCount.current!==null&&arr.length>prevCount.current)playAlert();prevCount.current=arr.length;setAvailable(arr);},[online]);
  const loadActive=useCallback(async()=>{if(!profile)return;const{data}=await db.from('orders').select('*').eq('courier_id',profile.id).in('status',['accepted','collecting','delivering']).order('updated_at',{ascending:false}).limit(1);setActive(data?.[0]||null);},[profile]);
  const loadStats=useCallback(async()=>{if(!profile)return;const today=new Date();today.setHours(0,0,0,0);const{data}=await db.from('orders').select('courier_price,price').eq('courier_id',profile.id).eq('status','done').gte('created_at',today.toISOString());const e=(data||[]).reduce((a,o)=>a+(o.courier_price?+o.courier_price:+o.price*0.8),0);setStats({d:data?.length||0,e:Math.round(e)});},[profile]);
  const loadAll=useCallback(async()=>{await Promise.all([loadAvail(),loadActive(),loadStats()]);setLoading(false);},[loadAvail,loadActive,loadStats]);

  // GPS tracking
  useEffect(()=>{
    if(!online||!profile)return;
    if(navigator.geolocation){watchRef.current=navigator.geolocation.watchPosition(async pos=>{await db.from('users').update({lat:pos.coords.latitude,lng:pos.coords.longitude,location_updated_at:new Date().toISOString()}).eq('id',profile.id);},(e)=>console.warn('GPS:',e.message),{enableHighAccuracy:true,maximumAge:10000,timeout:15000});}
    return()=>{if(watchRef.current!==null){navigator.geolocation.clearWatch(watchRef.current);watchRef.current=null;}};
  },[online,profile]);

  useEffect(()=>{db.from('users').select('is_online').eq('id',profile?.id).single().then(({data})=>{if(data)setOnline(data.is_online!==false);});},[profile]);
  useEffect(()=>{loadAll();},[loadAll]);
  useEffect(()=>{if(!profile)return;const sub=db.channel('cr').on('postgres_changes',{event:'*',schema:'public',table:'orders'},loadAll).subscribe();return()=>db.removeChannel(sub);},[profile,loadAll]);

  const processBonus=async order=>{
    if(!order.courier_id)return;
    const week=getWeekBounds(0);const ws=week.start.toISOString().slice(0,10),we=week.end.toISOString().slice(0,10);
    // Busca configuração do multinível do Supabase (ou usa padrão)
    const ml=getSetting('multinivel',{nivel1:0.70,nivel2_para_nivel1:0.70,nivel2_para_nivel0:0.30,total_pool:1.00});
    const POOL=+ml.total_pool||1.00;
    const L1=+ml.nivel1||0.70;
    const L2_L1=+ml.nivel2_para_nivel1||0.70;
    const L2_L0=+ml.nivel2_para_nivel0||0.30;
    const{data:courier}=await db.from('users').select('id,name,referred_by').eq('id',order.courier_id).single();
    let distribuido=0;
    // Nível 1 (quem indicou o entregador)
    if(courier?.referred_by){
      const{data:l1}=await db.from('users').select('id,name,can_refer,referred_by').eq('id',courier.referred_by).single();
      if(l1?.can_refer){
        await db.from('referral_bonuses').insert({earner_id:l1.id,earner_name:l1.name,source_courier_id:courier.id,source_courier_name:courier.name,order_id:order.id,level:1,amount:L1,week_start:ws,week_end:we});
        distribuido+=L1;
        // Nível 0 (quem indicou o nível 1)
        if(l1.referred_by){
          const{data:l0}=await db.from('users').select('id,name,can_refer').eq('id',l1.referred_by).single();
          if(l0?.can_refer){
            await db.from('referral_bonuses').insert({earner_id:l0.id,earner_name:l0.name,source_courier_id:courier.id,source_courier_name:courier.name,order_id:order.id,level:0,amount:L2_L0,week_start:ws,week_end:we});
            distribuido+=L2_L0;
          }
        }
      }
    }
    // O que sobrar do pool vai para a gestora
    const gestora=Math.max(0,+(POOL-distribuido).toFixed(2));
    if(gestora>0){
      await db.from('orders').update({gestora_amount:gestora}).eq('id',order.id);
    }
  };

  const accept=async id=>{const{error}=await db.from('orders').update({courier_id:profile.id,courier_name:profile.name,courier_phone:profile.phone||null,courier_number:profile.courier_number||null,status:'accepted',updated_at:new Date().toISOString()}).eq('id',id).eq('status','waiting');if(error){toast('Pedido já aceito por outro');return;}toast('Pedido aceito! 🛵');loadAll();};
  const advance=async(id,next)=>{await db.from('orders').update({status:next,updated_at:new Date().toISOString()}).eq('id',id);if(next==='done'){toast('Entrega concluída! 🎉');const{data:o}=await db.from('orders').select('*').eq('id',id).single();if(o)await processBonus(o);}else toast('Status atualizado ✓');loadAll();};

  const nextA={accepted:{l:'Cheguei para coletar ✓',n:'collecting'},collecting:{l:'Coletei — iniciar entrega ✓',n:'delivering'},delivering:{l:'Entregue! ✓',n:'done'}};

        <button className="btn-sm progress" style={{flex:1}} onClick={()=>advance(o.id,nextA[o.status].n)}>{nextA[o.status].l}</button>
      </div>

  };

  return <div className="screen">
    <Topbar title={<><span className="rdot"></span>Painel entregador</>} badge={profile?.name?.split(' ')[0]} badgeClass="bd"/>
    <div className="scroll">
      {profile?.courier_number&&<div style={{margin:'10px 14px 0',padding:'8px 14px',background:'var(--blue-l)',borderRadius:'var(--rs)',display:'flex',alignItems:'center',gap:10}}>
        <div style={{fontSize:24,fontWeight:800,color:'var(--blue)',letterSpacing:1}}>#{profile.courier_number}</div>
        <div style={{fontSize:12,color:'var(--blue)'}}>Seu número de identificação</div>
      </div>}
      <Toggle on={online} onToggle={toggleOnline} label="Disponível para pedidos" sublabel={online?'Você está online':'Você está offline'}/>
      <div className="mrow"><div className="mcard"><div className="mval">{stats.d}</div><div className="mlbl">entregas hoje</div></div><div className="mcard"><div className="mval">R${stats.e}</div><div className="mlbl">ganhos hoje</div></div><div className="mcard"><div className="mval">★ 5.0</div><div className="mlbl">avaliação</div></div></div>
      <div className="divider"/>
      <div className="stitle">Pedido ativo</div>
      {active?<ActiveOrderCard o={active}/>:<div className="notice ni" style={{margin:'8px 14px'}}>Nenhum pedido ativo. Aceite um abaixo!</div>}
      <div className="stitle" style={{paddingTop:8}}>Pedidos disponíveis</div>
      {loading?<Loading/>:!online?<div className="notice ni" style={{margin:'8px 14px'}}>Fique online para ver pedidos.</div>:available.length===0?<Empty icon="🔍" text="Nenhum pedido disponível agora."/>:

      <button className="tab-item" onClick={()=>setPage('courier-card')}><span className="tab-icon">⭐</span><span>Card</span></button>
      <button className="tab-item" onClick={()=>setPage('courier-shifts')}><span className="tab-icon">📅</span><span>Turnos</span></button>
      <button className="tab-item" onClick={()=>setPage('courier-closing')}><span className="tab-icon">✅</span><span>Fechamento</span></button>

function CourierFin({setPage}) {
  const {profile}=useAuth(); const toast=useToast(); const [data,setData]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{loadData();},[profile]);
  const loadData=async()=>{if(!profile)return;const wC=getWeekBounds(0),wP=getWeekBounds(-1),f=getWeekBounds(-3).start;const[or,pa,me,ne,bo]=await Promise.all([db.from('orders').select('courier_price,price,created_at,neighborhood').eq('courier_id',profile.id).eq('status','done').gte('created_at',f.toISOString()).order('created_at',{ascending:false}),db.from('payments').select('*').eq('type','courier_payout').eq('reference_id',profile.id).gte('created_at',f.toISOString()).order('created_at',{ascending:false}),db.from('users').select('can_refer,referral_code').eq('id',profile.id).single(),db.from('users').select('id,name,created_at').eq('referred_by',profile.id).eq('role','courier'),db.from('referral_bonuses').select('*').eq('earner_id',profile.id).order('created_at',{ascending:false}).limit(50)]);const orders=or.data||[],payments=pa.data||[],myMe=me.data,network=ne.data||[],bonuses=bo.data||[];const curr=orders.filter(o=>{const d=new Date(o.created_at);return d>=wC.start&&d<=wC.end;}),prev=orders.filter(o=>{const d=new Date(o.created_at);return d>=wP.start&&d<=wP.end;});const earn=a=>a.reduce((s,o)=>s+(o.courier_price?+o.courier_price:+o.price*.8),0);setData({wC,wP,curr,prev,currE:earn(curr),prevE:earn(prev),payments,me:myMe,network,bonuses});setLoading(false);};
  const copy=link=>{navigator.clipboard.writeText(link).then(()=>toast('Link copiado! ✓')).catch(()=>toast('Copie: '+link));};
  const share=link=>{if(navigator.share)navigator.share({title:'Entregou',text:'Cadastre-se como entregador:',url:link});else copy(link);};
  const [histTab, setHistTab] = useState('financial');
  if(loading)return<div className="screen"><Topbar title="Meu financeiro" onBack={()=>setPage('courier')}/><Loading/></div>;
  const{wC,wP,curr,prev,currE,prevE,payments,me,network,bonuses}=data;
  const pPend=payments.find(p=>p.status==='pending'&&p.week_start===wP.start.toISOString().slice(0,10));
  const pPaid=payments.find(p=>p.status==='paid'&&p.week_start===wP.start.toISOString().slice(0,10));
  const pAll=payments.filter(p=>p.status==='paid');
  const ubBonus=bonuses.filter(b=>!b.paid).reduce((a,b)=>a+(+b.amount),0);
  const tBonus=bonuses.reduce((a,b)=>a+(+b.amount),0);
  const appUrl=window.location.origin+window.location.pathname;
  const refLink=me?.referral_code?appUrl+'?role=courier&ref='+me.referral_code:null;
  const tsH = t => ({padding:'9px 14px',fontSize:13,fontWeight:histTab===t?600:400,cursor:'pointer',color:histTab===t?'var(--blue)':'var(--text2)',borderBottom:histTab===t?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',borderBottom:histTab===t?'2px solid var(--blue)':'2px solid transparent',fontFamily:'var(--font)'});
  return <div className="screen">
    <Topbar title="Financeiro & Histórico" onBack={()=>setPage('courier')} badge="Entregador" badgeClass="bd"/>
    <div className="scroll">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)'}}>
        <button style={tsH('financial')} onClick={()=>setHistTab('financial')}>💰 Financeiro</button>
        <button style={tsH('history')} onClick={()=>setHistTab('history')}>📋 Histórico</button>
      </div>
    <div style={{display:histTab==='financial'?'block':'none'}}><div style={{padding:'14px 14px 0'}}>
      <div className="stitle" style={{padding:'0 0 10px'}}>Semana atual</div>
      <div className="kgrid"><div className="mcard"><div className="mval" style={{color:'var(--green)'}}>{fmtMoney(currE)}</div><div className="mlbl">a receber</div></div><div className="mcard"><div className="mval">{curr.length}</div><div className="mlbl">entregas</div></div></div>
      <div className="stitle" style={{padding:'0 0 4px'}}>Semana anterior</div>
      <div style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>{fmtDate(wP.start)} a {fmtDate(wP.end)}</div>
      <div className="ocard" style={{margin:'0 0 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}><div><div style={{fontSize:13,fontWeight:600}}>{prev.length} entregas realizadas</div><div style={{fontSize:11,color:'var(--text2)'}}>Repasse via Pix semanal</div></div><div style={{fontSize:18,fontWeight:700,color:'var(--green)'}}>{fmtMoney(prevE)}</div></div>
        {pPend?<div className="notice ni" style={{margin:0}}>⏳ Repasse pendente — aguardando Pix</div>:pPaid?<div className="notice ns" style={{margin:0}}>✓ Pix recebido em {fmtDate(pPaid.paid_at)}</div>:<div className="notice ni" style={{margin:0}}>Repasse ainda não gerado pelo admin.</div>}
      </div>
      {pAll.length>0&&<>{pAll.map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:13,fontWeight:600}}>Pix recebido</div><div style={{fontSize:11,color:'var(--text2)'}}>{fmtDate(p.week_start)} a {fmtDate(p.week_end)} · {fmtDate(p.paid_at)}</div></div><div style={{fontSize:14,fontWeight:700,color:'var(--green)'}}>{fmtMoney(p.amount)}</div></div>)}</>}
      {curr.length>0&&<>{curr.map((o,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:12,fontWeight:600}}>{o.neighborhood||'Entrega'}</div><div style={{fontSize:11,color:'var(--text2)'}}>{ago(o.created_at)}</div></div><div style={{fontSize:13,fontWeight:700,color:'var(--green)',marginLeft:12}}>{fmtMoney(o.courier_price||o.price*.8)}</div></div>)}</>}
      <div className="stitle" style={{padding:'14px 0 10px'}}>Programa de indicação</div>
      {!me?.can_refer?<div className="notice ni" style={{margin:'0 0 14px'}}>Você ainda não tem permissão para indicar. Fale com o admin.</div>:<>
        <div className="kgrid"><div className="mcard"><div className="mval">{network.length}</div><div className="mlbl">indicados</div></div><div className="mcard"><div className="mval" style={{color:'var(--green)'}}>{fmtMoney(tBonus)}</div><div className="mlbl">total ganho</div></div><div className="mcard" style={{gridColumn:'span 2'}}><div className="mval" style={{color:'var(--amber)'}}>{fmtMoney(ubBonus)}</div><div className="mlbl">bônus a receber</div></div></div>
        <div style={{background:'var(--bg2)',borderRadius:'var(--r)',padding:14,marginBottom:14}}>

        </div>

      </>}
    </div></div>
  </div>;
}

function AdminSettings({setPage}) {
  const toast=useToast();
  const [tab,setTab]=useState('precos');
  const [bairros,setBairros]=useState([]);
  const [ml,setMl]=useState({nivel1:'0.70',nivel2_para_nivel1:'0.70',nivel2_para_nivel0:'0.30',total_pool:'1.00'});
  const [networks,setNetworks]=useState([]);
  const [clients,setClients]=useState([]);
  const [selNetwork,setSelNetwork]=useState('');
  const [selClient,setSelClient]=useState('');
  const [clientBairros,setClientBairros]=useState([]);
  const [newNetName,setNewNetName]=useState('');
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    setLoading(true);
    // Carrega multinível
    const{data:mlData}=await db.from('settings').select('value').eq('id','multinivel').single();
    if(mlData)setMl({nivel1:String(mlData.value.nivel1||0.70),nivel2_para_nivel1:String(mlData.value.nivel2_para_nivel1||0.70),nivel2_para_nivel0:String(mlData.value.nivel2_para_nivel0||0.30),total_pool:String(mlData.value.total_pool||1.00)});
    // Carrega bairros padrão do hardcode
    const defaultBairros=Object.entries(BAIRRO_PRECO).map(([key,v])=>({key,label:BAIRROS.find(([k])=>k===key)?.[1]||key,cliente:v.cliente,entregador:v.entregador}));
    setBairros(defaultBairros);
    // Carrega redes
    const{data:nets}=await db.from('networks').select('*').order('name');
    setNetworks(nets||[]);
    // Carrega clientes
    const{data:cls}=await db.from('users').select('id,name,network_id,price_table_id').eq('role','client').order('name');
    setClients(cls||[]);
    setLoading(false);
  };

  const saveMultinivel=async()=>{
    setSaving(true);
    const val={nivel1:+ml.nivel1,nivel2_para_nivel1:+ml.nivel2_para_nivel1,nivel2_para_nivel0:+ml.nivel2_para_nivel0,total_pool:+ml.total_pool};
    await db.from('settings').upsert({id:'multinivel',value:val,updated_at:new Date().toISOString()});
    await loadSettings();
    setSaving(false);toast('Configuração salva ✓');
  };

  const createNetwork=async()=>{
    if(!newNetName.trim()){toast('Digite o nome da rede');return;}
    const{error}=await db.from('networks').insert({name:newNetName.trim()});
    if(error){toast('Erro ao criar rede');return;}
    setNewNetName('');toast('Rede criada ✓');loadAll();
  };

  const loadClientPrices=async(clientId)=>{
    setSelClient(clientId);
    if(!clientId){setClientBairros([]);return;}
    const items=await getPriceTableForClient(clientId);
    setClientBairros(items.map(i=>({...i,_changed:false})));
  };

  const saveClientPrices=async()=>{
    if(!selClient){toast('Selecione um cliente');return;}
    setSaving(true);
    // Verifica se cliente tem tabela própria, se não cria
    const{data:user}=await db.from('users').select('price_table_id').eq('id',selClient).single();
    let tableId=user?.price_table_id;
    if(!tableId){
      const{data:nt}=await db.from('price_tables').insert({name:'Personalizada',client_id:selClient}).select().single();
      tableId=nt.id;
      await db.from('users').update({price_table_id:tableId}).eq('id',selClient);
    }
    // Deleta itens antigos e reinsere
    await db.from('price_items').delete().eq('price_table_id',tableId);
    const items=clientBairros.map(b=>({price_table_id:tableId,neighborhood_key:b.neighborhood_key||b.key,neighborhood_label:b.neighborhood_label||b.label,client_price:+b.client_price||+b.cliente,courier_price:+b.courier_price||+b.entregador}));
    await db.from('price_items').insert(items);
    setSaving(false);toast('Preços do cliente salvos ✓');
  };

  const assignNetwork=async(clientId,networkId)=>{
    await db.from('users').update({network_id:networkId||null}).eq('id',clientId);
    toast('Rede atualizada ✓');loadAll();
  };

  const ts=t=>({padding:'9px 14px',fontSize:13,fontWeight:tab===t?600:400,cursor:'pointer',color:tab===t?'var(--blue)':'var(--text2)',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',fontFamily:'var(--font)',whiteSpace:'nowrap'});

  if(loading)return<div className="screen"><Topbar title="Configurações" onBack={()=>setPage('admin')} badge="Admin" badgeClass="ba"/><Loading/></div>;

  return<div className="screen">
    <Topbar title="Configurações" onBack={()=>setPage('admin')} badge="Admin" badgeClass="ba"/>
    <div className="scroll">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)',overflowX:'auto'}}>
        <button style={ts('precos')} onClick={()=>setTab('precos')}>💰 Preços</button>
        <button style={ts('clientes')} onClick={()=>setTab('clientes')}>👤 Clientes</button>
        <button style={ts('redes')} onClick={()=>setTab('redes')}>🌐 Redes</button>
        <button style={ts('multinivel')} onClick={()=>setTab('multinivel')}>🔗 Multinível</button>
      </div>

      {tab==='precos'&&<div style={{padding:'14px'}}>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:10,lineHeight:1.5}}>
          Tabela de preços padrão. Cada linha é uma região/destino de entrega.<br/>
          <strong>Região</strong> = nome que aparece para o cliente escolher.
        </div>

        {/* Add new region button */}
        <button className="btn-sm accept" style={{marginBottom:12,width:'100%',padding:'9px'}} onClick={()=>{
          setBairros(prev=>[...prev,{key:'NOVA_'+Date.now(),label:'Nova região',cliente:10,entregador:8,_new:true}]);
        }}>+ Adicionar nova região</button>

        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr>
              <th style={{textAlign:'left',padding:'8px 6px',borderBottom:'2px solid var(--border)',fontSize:11,color:'var(--text2)',textTransform:'uppercase',minWidth:130}}>Região / Bairro</th>
              <th style={{textAlign:'center',padding:'8px 6px',borderBottom:'2px solid var(--border)',fontSize:11,color:'var(--text2)',textTransform:'uppercase',width:85}}>Cliente R$</th>
              <th style={{textAlign:'center',padding:'8px 6px',borderBottom:'2px solid var(--border)',fontSize:11,color:'var(--text2)',textTransform:'uppercase',width:85}}>Entregador R$</th>
              <th style={{textAlign:'center',padding:'8px 6px',borderBottom:'2px solid var(--border)',fontSize:11,color:'var(--text2)',textTransform:'uppercase',width:75}}>Gestora R$</th>
              <th style={{width:32,borderBottom:'2px solid var(--border)'}}></th>

              const ml_pool=+(getSetting('multinivel',{total_pool:1}).total_pool)||1;

                {b.label}: R${g.toFixed(2)}
              </div>;

        </div>

        <div className="notice ni" style={{marginTop:12,fontSize:12}}>

        </div>

      {tab==='clientes'&&<div style={{padding:'14px'}}>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:12,lineHeight:1.5}}>
          Cada cliente tem sua própria tabela de preços e bairros atendidos.<br/>
          O cliente vê apenas o que paga. O entregador vê apenas o que recebe. A gestora vê tudo.
        </div>
        <div className="fgrp" style={{padding:'0 0 12px'}}>
          <label className="flabel">Selecione o cliente</label>
          <select value={selClient} onChange={e=>loadClientPrices(e.target.value)}>
            <option value="">— Selecione um cliente —</option>

        </div>

          </div>

                    <td style={{padding:'6px 4px',textAlign:'center'}}><button onClick={()=>setClientBairros(prev=>prev.filter((_,idx)=>idx!==i))} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--red)',padding:'2px 4px'}}>×</button></td>
