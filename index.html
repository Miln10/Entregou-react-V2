  const [selClient,setSelClient]=useState('');
  const [clientObj,setClientObj]=useState(null);
  const [pickup,setPickup]=useState('');
  const [bairro,setBairro]=useState('');
  const [delivery,setDelivery]=useState('');
  const [item,setItem]=useState('');
  const [pay,setPay]=useState('App');
  const [courierSel,setCourierSel]=useState('');
  const [couriers,setCouriers]=useState([]);
  const [priceItems,setPriceItems]=useState([]);
  const [loading,setLoading]=useState(false);

  useEffect(()=>{
    db.from('users').select('id,name,is_online,vehicle').eq('role','courier').order('is_online',{ascending:false}).order('name').then(({data})=>setCouriers(data||[]));
    db.from('users').select('id,name,address,phone,price_table_id,network_id').eq('role','client').order('name').then(({data})=>setClients(data||[]));
  },[]);

  const onSelectClient=async(id)=>{
    setSelClient(id);
    if(!id){setClientObj(null);setPickup('');setPriceItems([]);return;}
    const cl=clients.find(c=>c.id===id);
    setClientObj(cl);
    // Preenche endereço de coleta default da loja
    setPickup(cl?.address||'');
    // Carrega tabela de preços do cliente
    const items=await getPriceTableForClient(id);
    setPriceItems(items);
  };

  const bairroLabel=bairro?BAIRROS.find(([v])=>v===bairro)?.[1]||bairro:'';
  const bairroPrice=priceItems.find(p=>(p.neighborhood_key||p.key)===bairro);
  const prices=bairroPrice
    ?{cliente:+(bairroPrice.client_price||bairroPrice.cliente),entregador:+(bairroPrice.courier_price||bairroPrice.entregador)}
    :(bairro?BAIRRO_PRECO[bairro]:null);
  const ml=getSetting('multinivel',{total_pool:1.00});
  const gestora=prices?+(prices.cliente-prices.entregador-(+ml.total_pool||1)).toFixed(2):0;

  const submit=async()=>{
    if(!selClient){toast('Selecione o cliente');return;}
    if(!bairro){toast('Selecione o bairro de entrega');return;}
    if(!item){toast('Descreva o pacote');return;}
    if(!prices){toast('Preço não encontrado para este bairro');return;}
    setLoading(true);
    const[cId,cNm]=courierSel?courierSel.split('|'):[null,null];
    const{error}=await db.from('orders').insert({
      client_id:selClient,
      client_name:clientObj?.name||'',
      pickup_addr:pickup||(clientObj?.address||'A confirmar'),
      delivery_addr:(delivery?delivery+' — ':'')+bairroLabel,
      neighborhood:bairro,item_desc:item,pay_method:pay,
      price:prices.cliente,courier_price:prices.entregador,
      gestora_amount:Math.max(0,gestora),
      status:cId?'accepted':'waiting',
      ...(cId&&{courier_id:cId,courier_name:cNm,courier_phone:couriers.find(c=>c.id===cId)?.phone||null})
    });
    setLoading(false);
    if(error){toast('Erro ao criar pedido');return;}
    toast(cId?`Pedido criado e alocado para ${cNm}! ✓`:'Pedido criado! 🎉');
    setPage('admin-orders');
  };

  return <AdminShell page="admin-new" setPage={setPage}>
    <Topbar title="Novo pedido" badge="Admin" badgeClass="ba"/>
    <div className="scroll">

      <div className="stitle">👤 Cliente (loja)</div>
      <div className="fgrp">
        <label className="flabel">Selecione o cliente</label>
        <select value={selClient} onChange={e=>onSelectClient(e.target.value)}>
          <option value="">— Selecione um cliente —</option>
          {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>

      <div className="stitle">📍 Local de coleta</div>
      <div className="fgrp">
        <label className="flabel">Endereço completo da loja / coleta</label>
        <input value={pickup} onChange={e=>setPickup(e.target.value)} placeholder="Rua, número, complemento..."/>
        {clientObj?.address&&pickup!==clientObj.address&&
          <button onClick={()=>setPickup(clientObj.address)} style={{marginTop:5,fontSize:12,color:'var(--blue)',background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline'}}>↩ Restaurar endereço da loja</button>}
      </div>

      <div className="stitle">🏠 Local de entrega (destino)</div>
      <div className="fgrp">
        <label className="flabel">Bairro de entrega</label>
        <BairroSelect id="adm-bairro" value={bairro} onChange={setBairro}/>
      </div>
      <div className="fgrp">
        <label className="flabel">Endereço completo de entrega</label>
        <input value={delivery} onChange={e=>setDelivery(e.target.value)} placeholder="Rua, número, complemento, referência..."/>
      </div>

      {prices&&<div className="pbox">
        <div className="prow"><span>Bairro</span><span style={{fontWeight:700,color:'var(--text)'}}>{bairroLabel}</span></div>
        <div className="prow"><span>Valor cliente</span><span style={{color:'var(--blue)',fontWeight:700}}>{fmtMoney(prices.cliente)}</span></div>
        <div className="prow"><span>Valor entregador</span><span style={{color:'var(--green)',fontWeight:700}}>{fmtMoney(prices.entregador)}</span></div>
        <div className="prow"><span>Pool multinível</span><span style={{color:'var(--text2)'}}>- {fmtMoney(+ml.total_pool||1)}</span></div>
        <div className="ptotal"><span>Gestora</span><span style={{color:gestora>=0?'var(--amber)':'var(--red)'}}>{gestora>=0?fmtMoney(gestora):'⚠️ Negativo!'}</span></div>
      </div>}

      <div className="stitle">📦 Pacote</div>
      <div className="fgrp"><label className="flabel">O que será coletado?</label><textarea value={item} onChange={e=>setItem(e.target.value)} placeholder="Ex: 2 marmitas, 1 envelope A4..."/></div>
      <div className="fgrp"><label className="flabel">Pagamento</label><select value={pay} onChange={e=>setPay(e.target.value)}><option>App</option><option>Pix</option><option>Dinheiro</option></select></div>

      <div className="stitle">🛵 Alocar entregador (opcional)</div>
      <div className="fgrp">
        <select value={courierSel} onChange={e=>setCourierSel(e.target.value)}>
          <option value="">— Deixar em aberto —</option>
          {couriers.map(c=><option key={c.id} value={`${c.id}|${c.name}`}>{c.is_online?'🟢':'⚪'} {c.name} — {c.vehicle||'Moto'}</option>)}
        </select>
      </div>

      <button className="btn btn-blue" style={{margin:'6px 20px',width:'calc(100% - 40px)'}} onClick={submit} disabled={loading}>
        {loading?'Criando...':'Criar pedido'}
      </button>
    </div>
  </AdminShell>;
}

function AdminAlloc({orderId,setPage}) {
  const toast=useToast(); const [order,setOrder]=useState(null); const [couriers,setCouriers]=useState([]);
  useEffect(()=>{db.from('orders').select('*').eq('id',orderId).single().then(({data})=>setOrder(data));db.from('users').select('*').eq('role','courier').order('is_online',{ascending:false}).order('name').then(({data})=>setCouriers(data||[]));},[orderId]);
  const alloc=async c=>{await db.from('orders').update({courier_id:c.id,courier_name:c.name,status:'accepted',updated_at:new Date().toISOString()}).eq('id',orderId);toast(`${c.name} alocado! ✓`);setPage('admin-orders');};
  const online=couriers.filter(c=>c.is_online),offline=couriers.filter(c=>!c.is_online);
  const rc=c=><div key={c.id} className="ocard" style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px'}}><div style={{width:36,height:36,borderRadius:'50%',background:c.is_online?'var(--green-l)':'var(--bg2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>🛵</div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{c.name}</div><div style={{fontSize:11,color:'var(--text2)'}}>{c.vehicle||'Moto'} · {c.plate||'—'} · {c.is_online?'🟢 Online':'⚪ Offline'}</div></div><button className="btn-sm accept" onClick={()=>alloc(c)}>Alocar</button></div>;
  return <div className="screen">
    <Topbar title="Alocar entregador" onBack={()=>setPage('admin-orders')} badge="Admin" badgeClass="ba"/>
    <div className="scroll">
      {order&&<div className="notice ni" style={{marginTop:12}}>Pedido <strong>{order.id.slice(0,8).toUpperCase()}</strong> · {order.pickup_addr} → {order.delivery_addr}{order.courier_price&&<> · Entregador recebe: <strong>{fmtMoney(order.courier_price)}</strong></>}</div>}
      <div className="stitle">Entregadores online</div>
      {online.length===0?<div className="notice ni" style={{margin:'8px 14px'}}>Nenhum online agora.</div>:online.map(rc)}
      <div className="stitle" style={{paddingTop:8}}>Todos os entregadores</div>
      {offline.length===0?<div style={{padding:'8px 14px',fontSize:13,color:'var(--text2)'}}>Todos estão online.</div>:offline.map(rc)}
    </div>
  </div>;
}

function AdminFin({setPage}) {
  const toast=useToast(); const [tab,setTab]=useState('payments'); const [data,setData]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{loadData();},[]);
  const loadData=async()=>{setLoading(true);const wC=getWeekBounds(0),wP=getWeekBounds(-1),twa=new Date(wP.start);const[or,pa,co,bo]=await Promise.all([db.from('orders').select('*').eq('status','done').gte('created_at',twa.toISOString()).order('created_at'),db.from('payments').select('*').gte('created_at',twa.toISOString()),db.from('users').select('*').eq('role','courier').order('name'),db.from('referral_bonuses').select('*').order('created_at',{ascending:false}).limit(100)]);setData({wC,wP,orders:or.data||[],payments:pa.data||[],couriers:co.data||[],bonuses:bo.data||[]});setLoading(false);};
  const genCharge=async(name,amt,ws,we)=>{await db.from('payments').insert({type:'client_charge',reference_name:name,week_start:ws,week_end:we,amount:amt,status:'pending'});toast(`Cobrança gerada para ${name}`);loadData();};
  const markPaid=async id=>{await db.from('payments').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',id);toast('Pagamento registrado ✓');loadData();};
  const genPayout=async(cId,cName,amt,ws,we)=>{const{data:ex}=await db.from('payments').select('id').eq('type','courier_payout').eq('reference_id',cId).eq('week_start',ws).maybeSingle();if(ex){toast('Repasse já gerado');return;}await db.from('payments').insert({type:'courier_payout',reference_id:cId,reference_name:cName,week_start:ws,week_end:we,amount:amt,status:'pending'});toast(`Repasse preparado para ${cName}`);loadData();};
  const confirmPayout=async(id,name,amt)=>{if(!confirm(`Confirmar Pix de ${fmtMoney(amt)} para ${name}?`))return;await db.from('payments').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',id);toast(`Pix confirmado para ${name} ✓`);loadData();};
  const toggleRef=async(id,enable,name,code)=>{const nc=enable?(code||genCode(name)):undefined;await db.from('users').update({can_refer:enable,...(enable&&nc&&{referral_code:nc})}).eq('id',id);toast(enable?`${name} pode indicar ✓`:'Permissão revogada');loadData();};
  const payBonuses=async(id,name,amt)=>{if(!confirm(`Pagar bônus de ${fmtMoney(amt)} para ${name}?`))return;await db.from('referral_bonuses').update({paid:true,paid_at:new Date().toISOString()}).eq('earner_id',id).eq('paid',false);toast(`Bônus pago para ${name} ✓`);loadData();};
  if(loading)return<AdminShell page="admin-fin" setPage={setPage}><Topbar title="Financeiro" badge="Admin" badgeClass="ba"/><Loading/></AdminShell>;
  const{wC,wP,orders,payments,couriers,bonuses}=data;
  const prev=orders.filter(o=>{const d=new Date(o.created_at);return d>=wP.start&&d<=wP.end;}),curr=orders.filter(o=>{const d=new Date(o.created_at);return d>=wC.start&&d<=wC.end;});
  const wps=wP.start.toISOString().slice(0,10),wpe=wP.end.toISOString().slice(0,10);
  const cliMap={};prev.forEach(o=>{if(!o.client_name)return;if(!cliMap[o.client_name])cliMap[o.client_name]={name:o.client_name,total:0,count:0};cliMap[o.client_name].total+=+o.price;cliMap[o.client_name].count++;});
  const couMap={};prev.forEach(o=>{if(!o.courier_id)return;if(!couMap[o.courier_id])couMap[o.courier_id]={id:o.courier_id,name:o.courier_name,total:0,count:0};couMap[o.courier_id].total+=o.courier_price?+o.courier_price:+o.price*.8;couMap[o.courier_id].count++;});
  const exC=payments.filter(p=>p.type==='client_charge'&&p.week_start===wps),exP=payments.filter(p=>p.type==='courier_payout'&&p.week_start===wps);
  const rev=curr.reduce((a,o)=>a+(+o.price),0),margin=curr.reduce((a,o)=>a+(+o.price-(o.courier_price?+o.courier_price:+o.price*.8)),0),pendC=payments.filter(p=>p.type==='courier_payout'&&p.status==='pending').reduce((a,p)=>a+(+p.amount),0);
  const nextWed=new Date(wC.start);nextWed.setDate(nextWed.getDate()+2);
  const aRef=couriers.filter(c=>c.can_refer).length,tBon=bonuses.reduce((a,b)=>a+(+b.amount),0),uBon=bonuses.filter(b=>!b.paid).reduce((a,b)=>a+(+b.amount),0);
  const ts=t=>({padding:'10px 16px',fontSize:13,fontWeight:tab===t?600:400,cursor:'pointer',color:tab===t?'var(--blue)':'var(--text2)',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',fontFamily:'var(--font)'});
  return <AdminShell page="admin-fin" setPage={setPage}>
    <Topbar title="Financeiro" badge="Admin" badgeClass="ba"/>
    <div className="scroll">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)'}}><button style={ts('payments')} onClick={()=>setTab('payments')}>Pagamentos</button><button style={ts('referrals')} onClick={()=>setTab('referrals')}>Indicações</button></div>
      {tab==='payments'&&<div style={{padding:'14px 14px 0'}}>
        <div className="kgrid"><div className="mcard"><div className="mval">{fmtMoney(rev)}</div><div className="mlbl">receita bruta</div></div><div className="mcard"><div className="mval">{fmtMoney(margin)}</div><div className="mlbl">margem</div></div><div className="mcard"><div className="mval">{curr.length}</div><div className="mlbl">entregas</div></div><div className="mcard"><div className="mval" style={{color:'var(--amber)'}}>{fmtMoney(pendC)}</div><div className="mlbl">a repassar</div></div></div>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>Cobranças clientes — semana anterior</div>
        <div style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>{fmtDate(wP.start)} a {fmtDate(wP.end)} · vence {fmtDate(nextWed)}</div>
        {Object.values(cliMap).length===0?<div className="notice ni" style={{margin:'0 0 14px'}}>Nenhuma entrega na semana anterior.</div>:Object.values(cliMap).map(c=>{const ex=exC.find(p=>p.reference_name===c.name);return<div key={c.name} className="ocard" style={{margin:'0 0 8px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}><div><div style={{fontSize:13,fontWeight:600}}>👤 {c.name}</div><div style={{fontSize:11,color:'var(--text2)'}}>{c.count} entrega{c.count>1?'s':''}</div></div><div style={{textAlign:'right'}}><div style={{fontSize:15,fontWeight:700,color:'var(--blue)'}}>{fmtMoney(c.total)}</div>{ex?.status==='paid'&&<span className="sbadge sdone">✓ Pago</span>}{ex?.status==='pending'&&<span className="sbadge sw">Pendente</span>}</div></div><div style={{display:'flex',gap:6}}>{!ex&&<button className="btn-sm accept" onClick={()=>genCharge(c.name,c.total,wps,wpe)}>Gerar cobrança</button>}{ex?.status==='pending'&&<button className="btn-sm progress" onClick={()=>markPaid(ex.id)}>Marcar como pago</button>}</div></div>;})}
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',margin:'14px 0 10px'}}>Repasse entregadores — semana anterior</div>
        {Object.values(couMap).length===0?<div className="notice ni" style={{margin:'0 0 14px'}}>Nenhuma entrega na semana anterior.</div>:Object.values(couMap).map(c=>{const ex=exP.find(p=>p.reference_id===c.id);return<div key={c.id} className="ocard" style={{margin:'0 0 8px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}><div><div style={{fontSize:13,fontWeight:600}}>🛵 {c.name}</div><div style={{fontSize:11,color:'var(--text2)'}}>{c.count} entrega{c.count>1?'s':''}</div></div><div style={{textAlign:'right'}}><div style={{fontSize:15,fontWeight:700,color:'var(--green)'}}>{fmtMoney(c.total)}</div>{ex?.status==='paid'&&<span className="sbadge sdone">✓ Pago</span>}{ex?.status==='pending'&&<span className="sbadge sw">Pendente</span>}</div></div><div style={{display:'flex',gap:6}}>{!ex&&<button className="btn-sm" style={{background:'var(--green-l)',borderColor:'var(--green-m)',color:'var(--green)'}} onClick={()=>genPayout(c.id,c.name,c.total,wps,wpe)}>Preparar Pix</button>}{ex?.status==='pending'&&<button className="btn-sm progress" onClick={()=>confirmPayout(ex.id,c.name,c.total)}>Confirmar Pix enviado</button>}</div></div>;})}
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',margin:'14px 0 10px'}}>Histórico</div>
        {payments.filter(p=>p.status==='paid').sort((a,b)=>new Date(b.paid_at)-new Date(a.paid_at)).slice(0,20).map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:13,fontWeight:600}}>{p.type==='client_charge'?'👤':'🛵'} {p.reference_name}</div><div style={{fontSize:11,color:'var(--text2)'}}>{p.type==='client_charge'?'Cobrança':'Repasse'} · {fmtDate(p.paid_at)}</div></div><div style={{fontSize:14,fontWeight:700,color:p.type==='client_charge'?'var(--blue)':'var(--green)'}}>{fmtMoney(p.amount)}</div></div>)}
      </div>}
      {tab==='referrals'&&<div style={{padding:'14px 14px 0'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:16}}><div className="mcard"><div className="mval">{aRef}</div><div className="mlbl">indicadores</div></div><div className="mcard"><div className="mval" style={{color:'var(--amber)'}}>{fmtMoney(uBon)}</div><div className="mlbl">a pagar</div></div><div className="mcard"><div className="mval">{fmtMoney(tBon)}</div><div className="mlbl">histórico</div></div></div>
        {couriers.map(c=>{const mb=bonuses.filter(b=>b.earner_id===c.id),mu=mb.filter(b=>!b.paid).reduce((a,b)=>a+(+b.amount),0),mn=couriers.filter(x=>x.referred_by===c.id).length;return<div key={c.id} className="ocard" style={{margin:'0 0 8px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}><div><div style={{fontSize:13,fontWeight:600}}>🛵 {c.name}</div><div style={{fontSize:11,color:'var(--text2)'}}>Rede: {mn} indicado{mn!==1?'s':''} · Bônus pendente: {fmtMoney(mu)}</div>{c.referral_code&&<div style={{fontSize:11,color:'var(--blue)',marginTop:2}}>Código: <strong>{c.referral_code}</strong></div>}</div><span className={`sbadge ${c.can_refer?'sdone':'scanc'}`}>{c.can_refer?'✓ Pode indicar':'Bloqueado'}</span></div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{!c.can_refer?<button className="btn-sm accept" onClick={()=>toggleRef(c.id,true,c.name,c.referral_code)}>Liberar para indicar</button>:<button className="btn-sm danger" onClick={()=>toggleRef(c.id,false,c.name,c.referral_code)}>Revogar permissão</button>}{mu>0&&<button className="btn-sm progress" onClick={()=>payBonuses(c.id,c.name,mu)}>Pagar bônus {fmtMoney(mu)}</button>}</div></div>;})}
      </div>}
    </div>
  </AdminShell>;
}

// ===== MAIN APP =====
function App() {
  const {profile, loading} = useAuth();
  const [page, setPage] = useState('auth');
  const [trackId, setTrackId] = useState(null);
  const [allocId, setAllocId] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);

  useEffect(() => {
    if (loading) return;
    if (!profile) { setPage('auth'); return; }
    if (profile.role === 'client')  setPage('new-order');
    if (profile.role === 'courier') setPage('courier');
    if (profile.role === 'admin')   setPage('admin');
  }, [profile, loading]);

  if (loading) return <div className="screen" style={{alignItems:'center',justifyContent:'center'}}><span className="spin"></span></div>;

  // Floating action button for navigation — only shown when logged in
  const NavFAB = () => profile ? <>
    {drawerOpen && <NavDrawer profile={profile} page={page} setPage={setPage} onClose={()=>setDrawerOpen(false)}/>}
    <button className="fab" onClick={()=>setDrawerOpen(o=>!o)} title="Menu de navegação">☰</button>
  </> : null;

  const goBack = () => {
    if (!profile) return setPage('auth');
    if (profile.role === 'client')  return setPage('client-orders');
    if (profile.role === 'courier') return setPage('courier');
    if (profile.role === 'admin')   return setPage('admin');
  };

  const renderPage = () => { switch(page) {
    case 'auth':          return <AuthPage/>;
    case 'client-orders': return <ClientOrders setPage={setPage} setTrackId={setTrackId}/>;
    case 'new-order':     return <NewOrder setPage={setPage}/>;
    case 'track':         return <TrackOrder orderId={trackId} setPage={setPage}/>;
    case 'courier':       return <CourierDash setPage={setPage}/>;
    case 'courier-fin':   return <CourierFin setPage={setPage}/>;
    case 'admin':         return <AdminReports setPage={setPage}/>;
    case 'admin-couriers': return <AdminCouriers setPage={setPage}/>;
    case 'admin-manual':   return <AdminManualDelivery setPage={setPage}/>;
    case 'client-closing': return <ClientClosing setPage={setPage}/>;
    case 'admin-shifts':      return <AdminShifts setPage={setPage}/>;
    case 'admin-new-client': return <AdminNewClient setPage={setPage}/>;
    case 'courier-card':   return <CourierCard setPage={setPage}/>
    case 'courier-shifts': return <CourierShifts setPage={setPage}/>;
    case 'courier-closing':return <CourierClosing setPage={setPage}/>;
    case 'admin-map':      return <AdminMap setPage={setPage}/>;
    case 'admin-settings': return <AdminSettings setPage={setPage}/>;
    case 'admin-orders':  return <AdminOrders setPage={setPage} setAllocId={setAllocId}/>;
    case 'admin-new':     return <AdminNewOrder setPage={setPage}/>;
    case 'admin-alloc':   return <AdminAlloc orderId={allocId} setPage={setPage}/>;
    case 'admin-fin':     return <AdminFin setPage={setPage}/>;
    case 'profile':       return <ProfilePage goBack={goBack}/>;
    default:              return <AuthPage/>;
  }};
  return <>{renderPage()}<NavFAB /></>;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthProvider><ToastProvider><App/></ToastProvider></AuthProvider>
);
</script>

<script>
// ===== SERVICE WORKER (PWA offline support) =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ===== INSTALL PROMPT =====
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install banner after 3s if not installed
  setTimeout(() => {
    if (deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
      const banner = document.createElement('div');
      banner.id = 'install-banner';
      banner.innerHTML = `
        <div style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:998;max-width:340px;width:calc(100% - 40px)">
          <span style="font-size:24px">📦</span>
          <div style="flex:1">
            <div>Instalar o Entregou</div>
            <div style="font-size:11px;font-weight:400;opacity:.7;margin-top:2px">Adicione à tela inicial para acesso rápido</div>
          </div>
          <button id="install-yes" style="background:#185FA5;color:white;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Instalar</button>
          <button id="install-no" style="background:transparent;color:white;border:none;font-size:18px;cursor:pointer;padding:0;opacity:.6">✕</button>
        </div>
      `;
      document.body.appendChild(banner);
      document.getElementById('install-yes').onclick = async () => {
        deferredPrompt.prompt();
        const {outcome} = await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.remove();
      };
      document.getElementById('install-no').onclick = () => banner.remove();
    }
  }, 3000);
});
</script>
</body>
</html>
