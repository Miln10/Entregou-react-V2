*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg2);min-height:100vh;display:flex;justify-content:center;}

.rbadge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;}
.bc{background:var(--blue-l);color:var(--blue);}
.bd{background:var(--green-l);color:var(--green);}
.ba{background:var(--amber-l);color:var(--amber);}

.sa{background:var(--blue-l);color:var(--blue);}
.sc{background:var(--green-l);color:var(--green);}
.sd{background:var(--purple-l);color:var(--purple);}
.sdone{background:var(--green-l);color:var(--green);}
.scanc{background:var(--red-l);color:var(--red);}
.ocard{margin:8px 14px;padding:14px 15px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);}
.ocard.hi{border-color:var(--blue-m);}

.flabel{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;}
.stitle{padding:13px 18px 5px;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;}
input,select,textarea{width:100%;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:var(--font);transition:border-color .15s;}

const ago = iso => { if(!iso)return''; const d=Math.floor((Date.now()-new Date(iso))/1000); if(d<60)return'agora'; if(d<3600)return Math.floor(d/60)+'min atrás'; if(d<86400)return Math.floor(d/3600)+'h atrás'; return Math.floor(d/86400)+'d atrás'; };
const getWeekBounds = (offset=0) => { const now=new Date(),day=now.getDay(),diff=day===0?-6:1-day,mon=new Date(now); mon.setDate(now.getDate()+diff+offset*7); mon.setHours(0,0,0,0); const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999); return{start:mon,end:sun}; };
const genCode = name => name.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4) + Math.random().toString(36).slice(2,6).toUpperCase();

// ===== CONTEXTS =====
const ToastCtx = createContext(null);
function ToastProvider({children}) {
  const [toasts, setToasts] = useState([]);
  const show = useCallback(msg => { const id=Date.now(); setToasts(t=>[...t,{id,msg}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000); },[]);
  return <ToastCtx.Provider value={show}>{children}<div className="toast-wrap">{toasts.map(t=><div key={t.id} className="toast">{t.msg}</div>)}</div></ToastCtx.Provider>;
}
const useToast = () => useContext(ToastCtx);

const AuthCtx = createContext(null);
function AuthProvider({children}) {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const loadProfile = async s => { const {data} = await db.from('users').select('*').eq('auth_id',s.user.id).single(); setProfile(data); setLoading(false); };
  useEffect(() => {
    db.auth.getSession().then(({data}) => { setSession(data.session); if(data.session) loadProfile(data.session); else setLoading(false); });
    const {data:l} = db.auth.onAuthStateChange(async(ev,s) => { setSession(s); if(ev==='SIGNED_IN'&&s) loadProfile(s); if(ev==='SIGNED_OUT'){setProfile(null);setLoading(false);} });
    return () => l.subscription.unsubscribe();
  },[]);
  const logout = async () => await db.auth.signOut();
  return <AuthCtx.Provider value={{session,profile,loading,logout}}>{children}</AuthCtx.Provider>;
}
const useAuth = () => useContext(AuthCtx);

// ===== LIVE MAP =====
function LiveMap({courierLat,courierLng,courierName,status}) {
  const mapRef = useRef(null), mapObj = useRef(null), marker = useRef(null);
  useEffect(() => {
    if(mapObj.current||!mapRef.current) return;
    const L = window.L; if(!L) return;
    const lat=courierLat||-22.9035, lng=courierLng||-43.1337;
    const map = L.map(mapRef.current,{zoomControl:true,attributionControl:false}).setView([lat,lng],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    mapObj.current = map;
    if(courierLat&&courierLng) {
      const icon=L.divIcon({html:`<div style="background:#3B6D11;width:36px;height:36px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3)">🛵</div>`,iconSize:[36,36],iconAnchor:[18,18],className:''});
      marker.current = L.marker([courierLat,courierLng],{icon}).addTo(map).bindPopup(`<strong>${courierName||'Entregador'}</strong>`);
      map.setView([courierLat,courierLng],15);
    }
    return () => { if(mapObj.current){mapObj.current.remove();mapObj.current=null;} };
  },[]);
  useEffect(() => {
    const L=window.L; if(!L||!mapObj.current||!courierLat||!courierLng) return;
    const pos=[courierLat,courierLng];
    if(marker.current) marker.current.setLatLng(pos);
    else { const icon=L.divIcon({html:`<div style="background:#3B6D11;width:36px;height:36px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3)">🛵</div>`,iconSize:[36,36],iconAnchor:[18,18],className:''}); marker.current=L.marker(pos,{icon}).addTo(mapObj.current); }
    mapObj.current.panTo(pos,{animate:true,duration:1});
  },[courierLat,courierLng]);
  const noLoc = !courierLat||!courierLng;
  return <div style={{margin:'10px 14px',borderRadius:12,overflow:'hidden',border:'1px solid var(--border)',position:'relative'}}>
    <div ref={mapRef} style={{height:200,width:'100%',background:'var(--bg2)'}}/>
    {(noLoc||status==='waiting')&&<div style={{position:'absolute',inset:0,background:'rgba(255,255,255,.85)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8}}>
      <div style={{fontSize:28}}>{status==='waiting'?'⏳':'📍'}</div>
      <div style={{fontSize:13,color:'#666',fontWeight:600}}>{status==='waiting'?'Aguardando entregador...':'Localizando entregador...'}</div>
    </div>}
  </div>;
}

// ===== SOUND =====
function playAlert() {
  try { const ctx=new(window.AudioContext||window.webkitAudioContext)(); const play=(f,s,d)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+s);g.gain.linearRampToValueAtTime(0.4,ctx.currentTime+s+0.01);g.gain.linearRampToValueAtTime(0,ctx.currentTime+s+d);o.start(ctx.currentTime+s);o.stop(ctx.currentTime+s+d+0.05);};play(520,0,0.12);play(660,0.15,0.12);play(800,0.30,0.20); } catch(e) {}
}

function CourierDash({setPage}) {
  const {profile}=useAuth(); const toast=useToast();
  const [online,setOnline]=useState(true);
  const [available,setAvailable]=useState([]);
  const [active,setActive]=useState(null);
  const [stats,setStats]=useState({d:0,e:0});
  const [loading,setLoading]=useState(true);
  const prevCount=useRef(null);
  const watchRef=useRef(null);

  const loadAvail=useCallback(async()=>{if(!online){setAvailable([]);return;}const{data}=await db.from('orders').select('*').eq('status','waiting').order('created_at');const arr=data||[];if(prevCount.current!==null&&arr.length>prevCount.current)playAlert();prevCount.current=arr.length;setAvailable(arr);},[online]);
  const loadActive=useCallback(async()=>{if(!profile)return;const{data}=await db.from('orders').select('*').eq('courier_id',profile.id).in('status',['accepted','collecting','delivering']).order('updated_at',{ascending:false}).limit(1);setActive(data?.[0]||null);},[profile]);
  const loadStats=useCallback(async()=>{if(!profile)return;const today=new Date();today.setHours(0,0,0,0);const{data}=await db.from('orders').select('courier_price,price').eq('courier_id',profile.id).eq('status','done').gte('created_at',today.toISOString());const e=(data||[]).reduce((a,o)=>a+(o.courier_price?+o.courier_price:+o.price*0.8),0);setStats({d:data?.length||0,e:Math.round(e)});},[profile]);
  const loadAll=useCallback(async()=>{await Promise.all([loadAvail(),loadActive(),loadStats()]);setLoading(false);},[loadAvail,loadActive,loadStats]);

  // GPS tracking
  useEffect(()=>{
    if(!online||!profile)return;
    if(navigator.geolocation){watchRef.current=navigator.geolocation.watchPosition(async pos=>{await db.from('users').update({lat:pos.coords.latitude,lng:pos.coords.longitude,location_updated_at:new Date().toISOString()}).eq('id',profile.id);},(e)=>console.warn('GPS:',e.message),{enableHighAccuracy:true,maximumAge:10000,timeout:15000});}
    return()=>{if(watchRef.current!==null){navigator.geolocation.clearWatch(watchRef.current);watchRef.current=null;}};
  },[online,profile]);

  useEffect(()=>{db.from('users').select('is_online').eq('id',profile?.id).single().then(({data})=>{if(data)setOnline(data.is_online!==false);});},[profile]);
  useEffect(()=>{loadAll();},[loadAll]);
  useEffect(()=>{if(!profile)return;const sub=db.channel('cr').on('postgres_changes',{event:'*',schema:'public',table:'orders'},loadAll).subscribe();return()=>db.removeChannel(sub);},[profile,loadAll]);

  const processBonus=async order=>{
    if(!order.courier_id)return;
    const week=getWeekBounds(0);const ws=week.start.toISOString().slice(0,10),we=week.end.toISOString().slice(0,10);
    const{data:c}=await db.from('users').select('id,name,referred_by').eq('id',order.courier_id).single();
    if(!c?.referred_by)return;
    const{data:l1}=await db.from('users').select('id,name,can_refer,referred_by').eq('id',c.referred_by).single();
    if(l1?.can_refer){await db.from('referral_bonuses').insert({earner_id:l1.id,earner_name:l1.name,source_courier_id:c.id,source_courier_name:c.name,order_id:order.id,level:1,amount:REFERRAL_L1,week_start:ws,week_end:we});if(l1.referred_by){const{data:l2}=await db.from('users').select('id,name,can_refer').eq('id',l1.referred_by).single();if(l2?.can_refer)await db.from('referral_bonuses').insert({earner_id:l2.id,earner_name:l2.name,source_courier_id:c.id,source_courier_name:c.name,order_id:order.id,level:2,amount:REFERRAL_L2,week_start:ws,week_end:we});}}

  const toggleOnline=async()=>{const next=!online;if(next&&navigator.geolocation){navigator.geolocation.getCurrentPosition(async pos=>{await db.from('users').update({is_online:true,lat:pos.coords.latitude,lng:pos.coords.longitude}).eq('id',profile.id);},()=>db.from('users').update({is_online:true}).eq('id',profile.id));}else await db.from('users').update({is_online:next,...(next?{}:{lat:null,lng:null})}).eq('id',profile.id);setOnline(next);if(!next)setAvailable([]);else loadAvail();};

  const nextA={accepted:{l:'Cheguei para coletar ✓',n:'collecting'},collecting:{l:'Coletei — iniciar entrega ✓',n:'delivering'},delivering:{l:'Entregue! ✓',n:'done'}};
  return <div className="screen">

      <div className="divider"/>

      <div className="stitle" style={{paddingTop:8}}>Pedidos disponíveis</div>
      {loading?<Loading/>:!online?<div className="notice ni" style={{margin:'8px 14px'}}>Fique online para ver pedidos.</div>:available.length===0?<Empty icon="🔍" text="Nenhum pedido disponível agora."/>:
        available.map(o=><OrderCard key={o.id} order={o} showCourierPrice actions={[<button key="acc" className="btn-sm accept" onClick={()=>accept(o.id)}>Aceitar pedido</button>]}/>)
      }
    </div>
    <div className="tabbar">
      <button className="tab-item active"><span className="tab-icon">🛵</span><span>Pedidos</span></button>
      <button className="tab-item" onClick={()=>setPage('courier-fin')}><span className="tab-icon">💰</span><span>Financeiro</span></button>
      <button className="tab-item" onClick={()=>setPage('profile')}><span className="tab-icon">👤</span><span>Perfil</span></button>
    </div>
  </div>;
}

function CourierFin({setPage}) {
  const {profile}=useAuth(); const toast=useToast(); const [data,setData]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{loadData();},[profile]);
  const loadData=async()=>{if(!profile)return;const wC=getWeekBounds(0),wP=getWeekBounds(-1),f=getWeekBounds(-3).start;const[or,pa,me,ne,bo]=await Promise.all([db.from('orders').select('courier_price,price,created_at,neighborhood').eq('courier_id',profile.id).eq('status','done').gte('created_at',f.toISOString()).order('created_at',{ascending:false}),db.from('payments').select('*').eq('type','courier_payout').eq('reference_id',profile.id).gte('created_at',f.toISOString()).order('created_at',{ascending:false}),db.from('users').select('can_refer,referral_code').eq('id',profile.id).single(),db.from('users').select('id,name,created_at').eq('referred_by',profile.id).eq('role','courier'),db.from('referral_bonuses').select('*').eq('earner_id',profile.id).order('created_at',{ascending:false}).limit(50)]);const orders=or.data||[],payments=pa.data||[],myMe=me.data,network=ne.data||[],bonuses=bo.data||[];const curr=orders.filter(o=>{const d=new Date(o.created_at);return d>=wC.start&&d<=wC.end;}),prev=orders.filter(o=>{const d=new Date(o.created_at);return d>=wP.start&&d<=wP.end;});const earn=a=>a.reduce((s,o)=>s+(o.courier_price?+o.courier_price:+o.price*.8),0);setData({wC,wP,curr,prev,currE:earn(curr),prevE:earn(prev),payments,me:myMe,network,bonuses});setLoading(false);};
  const copy=link=>{navigator.clipboard.writeText(link).then(()=>toast('Link copiado! ✓')).catch(()=>toast('Copie: '+link));};
  const share=link=>{if(navigator.share)navigator.share({title:'Entregou',text:'Cadastre-se como entregador:',url:link});else copy(link);};
  if(loading)return<div className="screen"><Topbar title="Meu financeiro" onBack={()=>setPage('courier')}/><Loading/></div>;
  const{wC,wP,curr,prev,currE,prevE,payments,me,network,bonuses}=data;
  const pPend=payments.find(p=>p.status==='pending'&&p.week_start===wP.start.toISOString().slice(0,10));
  const pPaid=payments.find(p=>p.status==='paid'&&p.week_start===wP.start.toISOString().slice(0,10));
  const pAll=payments.filter(p=>p.status==='paid');
  const ubBonus=bonuses.filter(b=>!b.paid).reduce((a,b)=>a+(+b.amount),0);
  const tBonus=bonuses.reduce((a,b)=>a+(+b.amount),0);
  const appUrl=window.location.origin+window.location.pathname;
  const refLink=me?.referral_code?appUrl+'?role=courier&ref='+me.referral_code:null;

      <div className="stitle" style={{padding:'0 0 10px'}}>Semana atual</div>
      <div className="kgrid"><div className="mcard"><div className="mval" style={{color:'var(--green)'}}>{fmtMoney(currE)}</div><div className="mlbl">a receber</div></div><div className="mcard"><div className="mval">{curr.length}</div><div className="mlbl">entregas</div></div></div>
      <div className="stitle" style={{padding:'0 0 4px'}}>Semana anterior</div>
      <div style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>{fmtDate(wP.start)} a {fmtDate(wP.end)}</div>
      <div className="ocard" style={{margin:'0 0 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}><div><div style={{fontSize:13,fontWeight:600}}>{prev.length} entregas realizadas</div><div style={{fontSize:11,color:'var(--text2)'}}>Repasse via Pix semanal</div></div><div style={{fontSize:18,fontWeight:700,color:'var(--green)'}}>{fmtMoney(prevE)}</div></div>
        {pPend?<div className="notice ni" style={{margin:0}}>⏳ Repasse pendente — aguardando Pix</div>:pPaid?<div className="notice ns" style={{margin:0}}>✓ Pix recebido em {fmtDate(pPaid.paid_at)}</div>:<div className="notice ni" style={{margin:0}}>Repasse ainda não gerado pelo admin.</div>}
      </div>
      {pAll.length>0&&<>{pAll.map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:13,fontWeight:600}}>Pix recebido</div><div style={{fontSize:11,color:'var(--text2)'}}>{fmtDate(p.week_start)} a {fmtDate(p.week_end)} · {fmtDate(p.paid_at)}</div></div><div style={{fontSize:14,fontWeight:700,color:'var(--green)'}}>{fmtMoney(p.amount)}</div></div>)}</>}
      {curr.length>0&&<>{curr.map((o,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:12,fontWeight:600}}>{o.neighborhood||'Entrega'}</div><div style={{fontSize:11,color:'var(--text2)'}}>{ago(o.created_at)}</div></div><div style={{fontSize:13,fontWeight:700,color:'var(--green)',marginLeft:12}}>{fmtMoney(o.courier_price||o.price*.8)}</div></div>)}</>}
      <div className="stitle" style={{padding:'14px 0 10px'}}>Programa de indicação</div>
      {!me?.can_refer?<div className="notice ni" style={{margin:'0 0 14px'}}>Você ainda não tem permissão para indicar. Fale com o admin.</div>:<>
        <div className="kgrid"><div className="mcard"><div className="mval">{network.length}</div><div className="mlbl">indicados</div></div><div className="mcard"><div className="mval" style={{color:'var(--green)'}}>{fmtMoney(tBonus)}</div><div className="mlbl">total ganho</div></div><div className="mcard" style={{gridColumn:'span 2'}}><div className="mval" style={{color:'var(--amber)'}}>{fmtMoney(ubBonus)}</div><div className="mlbl">bônus a receber</div></div></div>

          <div style={{display:'flex',gap:8}}><button className="btn-sm accept" onClick={()=>copy(refLink)}>Copiar link</button><button className="btn-sm" onClick={()=>share(refLink)}>Compartilhar</button></div>
          <div style={{fontSize:11,color:'var(--text2)',marginTop:8,lineHeight:1.6}}>Ganhe <strong>R$ 0,70</strong> por entrega de quem você indicar (nível 1)<br/>Ganhe <strong>R$ 0,30</strong> por entrega de quem seu indicado indicar (nível 2)</div>
        </div>
        {bonuses.slice(0,10).map(b=><div key={b.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:12,fontWeight:600}}>Entrega de {b.source_courier_name}</div><div style={{fontSize:11,color:'var(--text2)'}}>Nível {b.level} · {fmtDate(b.created_at)} · {b.paid?'✓ Pago':'Pendente'}</div></div><div style={{fontSize:13,fontWeight:700,color:'var(--green)'}}>{fmtMoney(b.amount)}</div></div>)}
      </>}
    </div></div>
  </div>;

  useEffect(()=>{loadData();},[]);
  const loadData=async()=>{setLoading(true);const wC=getWeekBounds(0),wP=getWeekBounds(-1),twa=new Date(wP.start);const[or,pa,co,bo]=await Promise.all([db.from('orders').select('*').eq('status','done').gte('created_at',twa.toISOString()).order('created_at'),db.from('payments').select('*').gte('created_at',twa.toISOString()),db.from('users').select('*').eq('role','courier').order('name'),db.from('referral_bonuses').select('*').order('created_at',{ascending:false}).limit(100)]);setData({wC,wP,orders:or.data||[],payments:pa.data||[],couriers:co.data||[],bonuses:bo.data||[]});setLoading(false);};
  const genCharge=async(name,amt,ws,we)=>{await db.from('payments').insert({type:'client_charge',reference_name:name,week_start:ws,week_end:we,amount:amt,status:'pending'});toast(`Cobrança gerada para ${name}`);loadData();};
  const markPaid=async id=>{await db.from('payments').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',id);toast('Pagamento registrado ✓');loadData();};
  const genPayout=async(cId,cName,amt,ws,we)=>{const{data:ex}=await db.from('payments').select('id').eq('type','courier_payout').eq('reference_id',cId).eq('week_start',ws).maybeSingle();if(ex){toast('Repasse já gerado');return;}await db.from('payments').insert({type:'courier_payout',reference_id:cId,reference_name:cName,week_start:ws,week_end:we,amount:amt,status:'pending'});toast(`Repasse preparado para ${cName}`);loadData();};
  const confirmPayout=async(id,name,amt)=>{if(!confirm(`Confirmar Pix de ${fmtMoney(amt)} para ${name}?`))return;await db.from('payments').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',id);toast(`Pix confirmado para ${name} ✓`);loadData();};
  const toggleRef=async(id,enable,name,code)=>{const nc=enable?(code||genCode(name)):undefined;await db.from('users').update({can_refer:enable,...(enable&&nc&&{referral_code:nc})}).eq('id',id);toast(enable?`${name} pode indicar ✓`:'Permissão revogada');loadData();};
  const payBonuses=async(id,name,amt)=>{if(!confirm(`Pagar bônus de ${fmtMoney(amt)} para ${name}?`))return;await db.from('referral_bonuses').update({paid:true,paid_at:new Date().toISOString()}).eq('earner_id',id).eq('paid',false);toast(`Bônus pago para ${name} ✓`);loadData();};
  if(loading)return<AdminShell page="admin-fin" setPage={setPage}><Topbar title="Financeiro" badge="Admin" badgeClass="ba"/><Loading/></AdminShell>;
  const{wC,wP,orders,payments,couriers,bonuses}=data;
  const prev=orders.filter(o=>{const d=new Date(o.created_at);return d>=wP.start&&d<=wP.end;}),curr=orders.filter(o=>{const d=new Date(o.created_at);return d>=wC.start&&d<=wC.end;});
  const wps=wP.start.toISOString().slice(0,10),wpe=wP.end.toISOString().slice(0,10);
  const cliMap={};prev.forEach(o=>{if(!o.client_name)return;if(!cliMap[o.client_name])cliMap[o.client_name]={name:o.client_name,total:0,count:0};cliMap[o.client_name].total+=+o.price;cliMap[o.client_name].count++;});
  const couMap={};prev.forEach(o=>{if(!o.courier_id)return;if(!couMap[o.courier_id])couMap[o.courier_id]={id:o.courier_id,name:o.courier_name,total:0,count:0};couMap[o.courier_id].total+=o.courier_price?+o.courier_price:+o.price*.8;couMap[o.courier_id].count++;});
  const exC=payments.filter(p=>p.type==='client_charge'&&p.week_start===wps),exP=payments.filter(p=>p.type==='courier_payout'&&p.week_start===wps);
  const rev=curr.reduce((a,o)=>a+(+o.price),0),margin=curr.reduce((a,o)=>a+(+o.price-(o.courier_price?+o.courier_price:+o.price*.8)),0),pendC=payments.filter(p=>p.type==='courier_payout'&&p.status==='pending').reduce((a,p)=>a+(+p.amount),0);
  const nextWed=new Date(wC.start);nextWed.setDate(nextWed.getDate()+2);
  const aRef=couriers.filter(c=>c.can_refer).length,tBon=bonuses.reduce((a,b)=>a+(+b.amount),0),uBon=bonuses.filter(b=>!b.paid).reduce((a,b)=>a+(+b.amount),0);
  const ts=t=>({padding:'10px 16px',fontSize:13,fontWeight:tab===t?600:400,cursor:'pointer',color:tab===t?'var(--blue)':'var(--text2)',borderBottom:tab===t?'2px solid var(--blue)':'2px solid transparent',background:'none',border:'none',fontFamily:'var(--font)'});
  return <AdminShell page="admin-fin" setPage={setPage}>
    <Topbar title="Financeiro" badge="Admin" badgeClass="ba"/>
    <div className="scroll">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)'}}><button style={ts('payments')} onClick={()=>setTab('payments')}>Pagamentos</button><button style={ts('referrals')} onClick={()=>setTab('referrals')}>Indicações</button></div>
      {tab==='payments'&&<div style={{padding:'14px 14px 0'}}>
        <div className="kgrid"><div className="mcard"><div className="mval">{fmtMoney(rev)}</div><div className="mlbl">receita bruta</div></div><div className="mcard"><div className="mval">{fmtMoney(margin)}</div><div className="mlbl">margem</div></div><div className="mcard"><div className="mval">{curr.length}</div><div className="mlbl">entregas</div></div><div className="mcard"><div className="mval" style={{color:'var(--amber)'}}>{fmtMoney(pendC)}</div><div className="mlbl">a repassar</div></div></div>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>Cobranças clientes — semana anterior</div>
        <div style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>{fmtDate(wP.start)} a {fmtDate(wP.end)} · vence {fmtDate(nextWed)}</div>
        {Object.values(cliMap).length===0?<div className="notice ni" style={{margin:'0 0 14px'}}>Nenhuma entrega na semana anterior.</div>:Object.values(cliMap).map(c=>{const ex=exC.find(p=>p.reference_name===c.name);return<div key={c.name} className="ocard" style={{margin:'0 0 8px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}><div><div style={{fontSize:13,fontWeight:600}}>👤 {c.name}</div><div style={{fontSize:11,color:'var(--text2)'}}>{c.count} entrega{c.count>1?'s':''}</div></div><div style={{textAlign:'right'}}><div style={{fontSize:15,fontWeight:700,color:'var(--blue)'}}>{fmtMoney(c.total)}</div>{ex?.status==='paid'&&<span className="sbadge sdone">✓ Pago</span>}{ex?.status==='pending'&&<span className="sbadge sw">Pendente</span>}</div></div><div style={{display:'flex',gap:6}}>{!ex&&<button className="btn-sm accept" onClick={()=>genCharge(c.name,c.total,wps,wpe)}>Gerar cobrança</button>}{ex?.status==='pending'&&<button className="btn-sm progress" onClick={()=>markPaid(ex.id)}>Marcar como pago</button>}</div></div>;})}
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',margin:'14px 0 10px'}}>Repasse entregadores — semana anterior</div>
        {Object.values(couMap).length===0?<div className="notice ni" style={{margin:'0 0 14px'}}>Nenhuma entrega na semana anterior.</div>:Object.values(couMap).map(c=>{const ex=exP.find(p=>p.reference_id===c.id);return<div key={c.id} className="ocard" style={{margin:'0 0 8px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}><div><div style={{fontSize:13,fontWeight:600}}>🛵 {c.name}</div><div style={{fontSize:11,color:'var(--text2)'}}>{c.count} entrega{c.count>1?'s':''}</div></div><div style={{textAlign:'right'}}><div style={{fontSize:15,fontWeight:700,color:'var(--green)'}}>{fmtMoney(c.total)}</div>{ex?.status==='paid'&&<span className="sbadge sdone">✓ Pago</span>}{ex?.status==='pending'&&<span className="sbadge sw">Pendente</span>}</div></div><div style={{display:'flex',gap:6}}>{!ex&&<button className="btn-sm" style={{background:'var(--green-l)',borderColor:'var(--green-m)',color:'var(--green)'}} onClick={()=>genPayout(c.id,c.name,c.total,wps,wpe)}>Preparar Pix</button>}{ex?.status==='pending'&&<button className="btn-sm progress" onClick={()=>confirmPayout(ex.id,c.name,c.total)}>Confirmar Pix enviado</button>}</div></div>;})}
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em',margin:'14px 0 10px'}}>Histórico</div>
        {payments.filter(p=>p.status==='paid').sort((a,b)=>new Date(b.paid_at)-new Date(a.paid_at)).slice(0,20).map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:13,fontWeight:600}}>{p.type==='client_charge'?'👤':'🛵'} {p.reference_name}</div><div style={{fontSize:11,color:'var(--text2)'}}>{p.type==='client_charge'?'Cobrança':'Repasse'} · {fmtDate(p.paid_at)}</div></div><div style={{fontSize:14,fontWeight:700,color:p.type==='client_charge'?'var(--blue)':'var(--green)'}}>{fmtMoney(p.amount)}</div></div>)}
      </div>}
      {tab==='referrals'&&<div style={{padding:'14px 14px 0'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:16}}><div className="mcard"><div className="mval">{aRef}</div><div className="mlbl">indicadores</div></div><div className="mcard"><div className="mval" style={{color:'var(--amber)'}}>{fmtMoney(uBon)}</div><div className="mlbl">a pagar</div></div><div className="mcard"><div className="mval">{fmtMoney(tBon)}</div><div className="mlbl">histórico</div></div></div>
        {couriers.map(c=>{const mb=bonuses.filter(b=>b.earner_id===c.id),mu=mb.filter(b=>!b.paid).reduce((a,b)=>a+(+b.amount),0),mn=couriers.filter(x=>x.referred_by===c.id).length;return<div key={c.id} className="ocard" style={{margin:'0 0 8px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}><div><div style={{fontSize:13,fontWeight:600}}>🛵 {c.name}</div><div style={{fontSize:11,color:'var(--text2)'}}>Rede: {mn} indicado{mn!==1?'s':''} · Bônus pendente: {fmtMoney(mu)}</div>{c.referral_code&&<div style={{fontSize:11,color:'var(--blue)',marginTop:2}}>Código: <strong>{c.referral_code}</strong></div>}</div><span className={`sbadge ${c.can_refer?'sdone':'scanc'}`}>{c.can_refer?'✓ Pode indicar':'Bloqueado'}</span></div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{!c.can_refer?<button className="btn-sm accept" onClick={()=>toggleRef(c.id,true,c.name,c.referral_code)}>Liberar para indicar</button>:<button className="btn-sm danger" onClick={()=>toggleRef(c.id,false,c.name,c.referral_code)}>Revogar permissão</button>}{mu>0&&<button className="btn-sm progress" onClick={()=>payBonuses(c.id,c.name,mu)}>Pagar bônus {fmtMoney(mu)}</button>}</div></div>;})}
      </div>}
    </div>
  </AdminShell>;
}

// ===== MAIN APP =====
function App() {
  const {profile, loading} = useAuth();
  const [page, setPage] = useState('auth');
  const [trackId, setTrackId] = useState(null);
  const [allocId, setAllocId] = useState(null);

  useEffect(() => {
    if (loading) return;
    if (!profile) { setPage('auth'); return; }
    if (profile.role === 'client')  setPage('client-orders');
    if (profile.role === 'courier') setPage('courier');
    if (profile.role === 'admin')   setPage('admin');
  }, [profile, loading]);

  if (loading) return <div className="screen" style={{alignItems:'center',justifyContent:'center'}}><span className="spin"></span></div>;

  const goBack = () => {
    if (!profile) return setPage('auth');
    if (profile.role === 'client')  return setPage('client-orders');
    if (profile.role === 'courier') return setPage('courier');
    if (profile.role === 'admin')   return setPage('admin');
  };

  switch(page) {
    case 'auth':          return <AuthPage/>;
    case 'client-orders': return <ClientOrders setPage={setPage} setTrackId={setTrackId}/>;
    case 'new-order':     return <NewOrder setPage={setPage}/>;
    case 'track':         return <TrackOrder orderId={trackId} setPage={setPage}/>;
    case 'courier':       return <CourierDash setPage={setPage}/>;
    case 'courier-fin':   return <CourierFin setPage={setPage}/>;
    case 'admin':         return <AdminReports setPage={setPage}/>;
    case 'admin-orders':  return <AdminOrders setPage={setPage} setAllocId={setAllocId}/>;
    case 'admin-new':     return <AdminNewOrder setPage={setPage}/>;
    case 'admin-alloc':   return <AdminAlloc orderId={allocId} setPage={setPage}/>;
    case 'admin-fin':     return <AdminFin setPage={setPage}/>;
    case 'profile':       return <ProfilePage goBack={goBack}/>;
    default:              return <AuthPage/>;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthProvider><ToastProvider><App/></ToastProvider></AuthProvider>
);
</script>
</body>
</html>
